<!doctype html>
<meta charset="utf-8">
<title>Historia Borja</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22bbg%22%20x1=%220%22%20y1=%220%22%20x2=%220%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%23F6E6B0%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23C9A55A%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d=%22M32%202%20L59%209%20V31%20C59%2046%2047%2057%2032%2062%20C17%2057%205%2046%205%2031%20V9%20Z%22%20fill=%22%23101B30%22%20stroke=%22%23C9A55A%22%20stroke-width=%222%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M32%202%20L59%209%20V31%20C59%2046%2047%2057%2032%2062%20C17%2057%205%2046%205%2031%20V9%20Z%22%20fill=%22none%22%20stroke=%22%23C9A55A%22%20stroke-opacity=%22.35%22%20stroke-width=%22.8%22%20transform=%22translate(32%2032)%20scale(.88)%20translate(-32%20-32)%22/%3E%3Cg%20transform=%22translate(11%2011.5)%20scale(.66)%22%3E%3Cpath%20fill=%22url(%23bbg)%22%20d=%22M13%204%20L27%2019%20L32%2017%20L37%2019%20L51%204%20L56%2027%20L61%2035%20L54%2039%20L58%2048%20L47%2049%20L42%2057%20L32%2062%20L22%2057%20L17%2049%20L6%2048%20L10%2039%20L3%2035%20L8%2027%20Z%22/%3E%3Cg%20fill=%22%23101B30%22%3E%3Cpath%20d=%22M14%2030.5%20L29.5%2036.5%20L26%2039.5%20L16.5%2035%20Z%22/%3E%3Cpath%20d=%22M50%2030.5%20L34.5%2036.5%20L38%2039.5%20L47.5%2035%20Z%22/%3E%3Cpath%20d=%22M32%2021%20L34%2030%20L33%2045%20L32%2047%20L31%2045%20L30%2030%20Z%22/%3E%3Cpath%20d=%22M27.5%2050%20L36.5%2050%20L32%2056.5%20Z%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky credit + header, one centred column of bold coloured "lab-bench" cards; bottom tab bar on phones.
   Colour: each syllabus theme wears a real lab stain — methylene blue (A), chlorophyll (B), iodine (C), haemoglobin (D). */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface2:#F7F8FA; --ink:#16212E; --muted:#5B6675; --line:#D8DDE4;
  --brand:#1F3A5F; --brand-ink:#FFFFFF; --pop:#B08D3C; --pop-ink:#FFFFFF;
  --tA:#2F5D8C; --tB:#3F7D5B; --tC:#A06A2C; --tD:#8C3B4A;
  --good:#2F7D55; --bad:#B23A3F; --warn:#B7861F;
  --paper:#FFFFFF; --shadow:0 1px 2px rgba(22,33,46,.06),0 4px 14px -8px rgba(22,33,46,.18);
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151D; --surface:#171F2A; --surface2:#1C2633; --ink:#E6EAF0; --muted:#98A3B3; --line:#2A3544;
  --brand:#7FA3D1; --brand-ink:#0B121A; --pop:#C9A55A; --pop-ink:#161006;
  --tA:#7FA3D1; --tB:#6FB08A; --tC:#C9955A; --tD:#C47A87; --good:#5DB37F; --bad:#D9777B; --warn:#D1A444;
  --paper:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -10px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151D; --surface:#171F2A; --surface2:#1C2633; --ink:#E6EAF0; --muted:#98A3B3; --line:#2A3544;
  --brand:#7FA3D1; --brand-ink:#0B121A; --pop:#C9A55A; --pop-ink:#161006;
  --tA:#7FA3D1; --tB:#6FB08A; --tC:#C9955A; --tD:#C47A87; --good:#5DB37F; --bad:#D9777B; --warn:#D1A444;
  --paper:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -10px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* credit + header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
.credit{background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:800;letter-spacing:.04em;text-align:center;padding-block:5px}
.credit span{opacity:.75;font-weight:600}
.hdr{background:var(--surface);border-bottom:2px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo b{font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:-.01em}
.logo i{font-style:normal;background:var(--brand);color:var(--brand-ink);font-family:var(--f-mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:800;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav button:hover{color:var(--ink)}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-weight:800;font-size:13px;background:var(--surface2);border:2px solid var(--line);white-space:nowrap}
.chip.xp{background:var(--pop);color:var(--pop-ink);border-color:transparent}
.chip.cd{border-color:var(--tD);color:var(--tD)}
.iconbtn{border:2px solid var(--line);background:var(--surface2);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;padding:0}
.bnav{display:none}
@media (max-width:760px){
  .nav{display:none}
  .chip.cd{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:2px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav button{border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted)}
  .bnav button[aria-current="page"]{color:var(--brand)}
  .bnav svg{width:22px;height:22px}
  main{padding-bottom:84px}
}
main{padding-block:20px 48px}

/* generic */
.grid{display:grid;gap:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:900;font-size:16px;background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--brand) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--brand) 60%,#000)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.pop{background:var(--pop);color:var(--pop-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--pop) 55%,#000)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line)}
.pill.hl{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.t-A{--tc:var(--tA)} .t-B{--tc:var(--tB)} .t-C{--tc:var(--tC)} .t-D{--tc:var(--tD)}
.bar{height:10px;border-radius:99px;background:var(--surface2);border:1.5px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--tc,var(--brand));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sectionhead h2{font-size:26px}
.back{border:0;background:none;font-weight:900;color:var(--muted);padding:0;margin-bottom:10px}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.countdown{background:var(--ink);color:var(--bg);border-radius:22px;padding:20px;position:relative;overflow:hidden;border:0}
.countdown h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;color:var(--bg)}
.countdown .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.exams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:520px){.exams{grid-template-columns:1fr}}
.exam{border-radius:16px;padding:14px;background:color-mix(in srgb,var(--bg) 8%,transparent);border:2px solid color-mix(in srgb,var(--bg) 18%,transparent)}
.exam .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:900}
.exam .lbl em{font-style:normal;font-size:12px;opacity:.75;font-weight:700}
.digits{display:flex;gap:6px;margin-top:8px}
.digit{flex:1;text-align:center;background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 0 4px;min-width:0}
.digit b{display:block;font-family:var(--f-mono);font-size:clamp(20px,3.6vw,28px);line-height:1.1;font-variant-numeric:tabular-nums}
.digit small{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.exam.p1 .digit b{color:var(--tA)} .exam.p2 .digit b{color:var(--tD)}
.exam .meta{font-size:12.5px;margin-top:8px;opacity:.8}
.helix{position:absolute;right:-40px;top:-120px;opacity:.12;pointer-events:none}
.levelcard{display:flex;flex-direction:column;gap:12px}
.lvl{display:flex;align-items:center;gap:14px}
.lvl .badge{width:62px;height:62px;border-radius:18px;background:var(--pop);color:var(--pop-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;flex:none;transform:rotate(-4deg)}
.lvl h3{font-size:22px}
.missions{display:grid;gap:8px}
.mission{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:2px solid var(--line);font-weight:700}
.mission.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.mission .ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px}
.mission.done .ck{background:var(--good);border-color:var(--good);color:#fff}
.mission .n{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.today{border-left:0;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
@media (max-width:620px){.today{grid-template-columns:1fr}}
.today .date{font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--pop);color:var(--pop-ink);border-radius:14px;padding:10px 12px;text-align:center;line-height:1.1}
.today .date b{display:block;font-size:30px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:860px){.quick{grid-template-columns:repeat(2,1fr)}}
.qbtn{border:0;border-radius:18px;padding:16px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:6px;min-height:128px;box-shadow:0 5px 0 color-mix(in srgb,var(--qc) 55%,#000);background:var(--qc);transition:transform .1s}
.qbtn:hover{transform:translateY(-2px) rotate(-.5deg)}
.qbtn:active{transform:translateY(3px)}
.qbtn b{font-family:var(--f-display);font-size:20px;line-height:1.1}
.qbtn span{font-size:13.5px;font-weight:700;opacity:.92}
.qbtn svg{width:30px;height:30px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:860px){.themes{grid-template-columns:repeat(2,1fr)}}
.theme{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px}
.theme .L{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--tc);line-height:1}
.theme b{font-size:15px}

/* map */
.mapgrid{display:grid;grid-template-columns:110px repeat(4,1fr);gap:8px;min-width:720px}
.mapscroll{overflow-x:auto;padding-bottom:6px}
.mh{font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:end;padding:4px}
.mrow{font-family:var(--f-display);font-weight:800;color:var(--tc);display:flex;flex-direction:column;justify-content:center;padding:6px;border-radius:12px;background:color-mix(in srgb,var(--tc) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--tc) 35%,transparent);font-size:15px;line-height:1.1}
.mrow b{font-size:28px}
.mcell{display:flex;flex-direction:column;gap:6px}
.tile{border:2px solid color-mix(in srgb,var(--tc) 40%,var(--line));background:var(--surface);border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:5px;position:relative;transition:transform .1s, box-shadow .1s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 0 -1px color-mix(in srgb,var(--tc) 50%,transparent)}
.tile .code{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--tc)}
.tile .nm{font-weight:800;font-size:14px;line-height:1.2}
.tile .pill{position:absolute;top:6px;right:6px;font-size:9.5px;padding:1px 6px}
.tile .bar{height:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted)}

/* topic */
.thead{border-radius:22px;padding:22px;color:#fff;background:var(--tc);position:relative;overflow:hidden}
.thead h1{font-size:clamp(28px,5vw,44px);font-weight:800}
.thead .code{font-family:var(--f-mono);font-weight:700;background:rgba(0,0,0,.22);padding:3px 8px;border-radius:8px;font-size:14px}
.thead ul{margin:12px 0 0;padding-left:20px;font-weight:700;max-width:70ch}
.thead .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.thead .stats span{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px}
.tabs{display:flex;gap:6px;margin:16px 0;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:900}
.tabs button[aria-selected="true"]{background:var(--tc,var(--ink));border-color:var(--tc,var(--ink));color:#fff}
.uitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.uitem .c{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--tc)}
.uitem .t{font-weight:700}
.uitem details{grid-column:1/-1}
.uitem summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--muted)}
.uitem details p{margin:6px 0 0}
.rag{display:flex;gap:4px}
.rag button{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);font-size:12px;font-weight:900;padding:0}
.rag button.r[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.rag button.a[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#2b1f00}
.rag button.g[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}

/* flashcards */
.fc-wrap{max-width:680px;margin:0 auto}
.fc{perspective:1400px;height:340px;cursor:pointer;margin:10px 0 14px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:auto}
.fc-front{background:var(--tc);color:#fff;box-shadow:0 8px 0 color-mix(in srgb,var(--tc) 55%,#000)}
.fc-front .q{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3.6vw,30px);line-height:1.15}
.fc-back{background:var(--surface);border:3px solid var(--tc);transform:rotateY(180deg);font-size:18px;font-weight:700;box-shadow:0 8px 0 color-mix(in srgb,var(--tc) 40%,transparent)}
.fc-face .c{font-family:var(--f-mono);font-size:13px;font-weight:700;opacity:.85}
.fc-hint{font-size:13px;font-weight:800;opacity:.8}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fc-actions .btn{padding:16px}
.btn.again{background:var(--bad);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 55%,#000)}
.btn.got{background:var(--good);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 55%,#000)}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.k{background:var(--good)} .dots i.x{background:var(--bad)} .dots i.cur{outline:2px solid var(--ink);outline-offset:1px}

/* question runner */
.runner{max-width:820px;margin:0 auto}
.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rtop .prog{flex:1;min-width:140px}
.timer{font-family:var(--f-mono);font-weight:700;font-size:18px;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:10px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.combo{font-family:var(--f-display);font-weight:800;color:var(--tC);font-size:18px}
.paper{background:var(--paper);border-radius:16px;padding:14px;border:2px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.paper img{display:block;width:100%;max-width:calc(var(--w,953) * 1px);height:auto;cursor:zoom-in}
.zhint{display:none}
@media (max-width:620px){.paper{overflow-x:auto;padding:10px}.paper img{width:calc(var(--w,953) * .62px);max-width:none}.zhint{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin:6px 2px 0}}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.qmeta .tag{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:color-mix(in srgb,var(--tc) 14%,var(--surface));color:var(--tc);border:1.5px solid color-mix(in srgb,var(--tc) 40%,transparent)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.opt{border:0;border-radius:16px;padding:14px 0;font-family:var(--f-display);font-weight:800;font-size:30px;color:#fff;background:var(--oc);box-shadow:0 5px 0 color-mix(in srgb,var(--oc) 55%,#000);transition:transform .08s}
.opt:nth-child(1){--oc:var(--tA)} .opt:nth-child(2){--oc:var(--tB)} .opt:nth-child(3){--oc:var(--tC)} .opt:nth-child(4){--oc:var(--tD)}

.gymgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gymst{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:18px;border:2.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;box-shadow:0 4px 0 var(--tc,var(--line));cursor:pointer;transition:transform .1s}

.gymst .gi{font-size:28px;line-height:1}.gymst b{font-size:16px;line-height:1.2}.gymst .gt{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:700}

.gymin{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.gymin input{flex:1;min-width:140px;font:inherit;font-family:var(--f-mono);font-size:22px;font-weight:700;padding:12px 14px;border-radius:14px;border:2.5px solid var(--line);background:var(--surface);color:var(--ink)}
.gymin input:focus{outline:none;border-color:var(--tc,var(--brand))}

ol.steps{margin:8px 0 0;padding-left:20px;font-family:var(--f-mono);font-size:14.5px;font-weight:600;display:grid;gap:4px}
/* Historia Borja logo */
.logo{gap:10px}
.logo .bt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.logo .bt small{font-family:var(--f-body,inherit);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.logo-mark{display:block;flex:none;width:40px;height:40px;transition:filter .2s}
.logo-mark svg{width:100%;height:100%;display:block}
.logo:hover .logo-mark{filter:drop-shadow(0 0 6px rgba(201,165,90,.55))}
@media (max-width:420px){.logo-mark{width:34px;height:34px}}
/* heroes & powers */
.pwbar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:4px 0 6px;scrollbar-width:thin}
.pw{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .1s}
.pw:active{transform:translateY(2px)}.pw:disabled{opacity:.42;cursor:not-allowed}
.pw.on{border-color:var(--pop);box-shadow:0 3px 0 var(--pop);background:color-mix(in srgb,var(--pop) 18%,var(--surface))}
.pw .av{width:34px;height:34px;display:block}.pw .av svg{width:100%;height:100%}
.pw .pl{display:flex;flex-direction:column;line-height:1.1;text-align:left}.pw .pl b{font-size:13px}.pw .pl i{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:800}
.opt.gone{opacity:.15;filter:grayscale(1);pointer-events:none}
.opt.hint{box-shadow:0 0 0 4px #c6d3f4,0 0 22px 6px rgba(150,175,255,.75);animation:hintPulse 1.2s ease-in-out infinite}
@keyframes hintPulse{50%{box-shadow:0 0 0 4px #c6d3f4,0 0 32px 12px rgba(150,175,255,.95)}}
.pwfx{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:300;display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 26px;border-radius:24px;background:var(--surface);border:3px solid var(--pop);box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pwIn 1.3s ease forwards;pointer-events:none}
.pwfx .av{width:84px;height:84px}.pwfx .av svg{width:100%;height:100%}.pwfx b{font-family:var(--f-display);font-size:22px}.pwfx span:last-child{font-weight:900;color:var(--muted)}
@keyframes pwIn{0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
.herogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.herocard{display:flex;gap:14px;align-items:flex-start}
.herocard .hav{position:relative;width:86px;height:86px;flex:none;border-radius:22px;background:var(--surface2,var(--bg));display:grid;place-items:center}
.herocard .hav svg{width:74px;height:74px}
.herocard.locked .hav svg{filter:grayscale(1) brightness(.6);opacity:.55}
.herocard .lk{position:absolute;right:-6px;bottom:-6px;font-size:22px}
.herocard .hb b{font-family:var(--f-display);font-size:22px}.herocard .ho{display:block;color:var(--muted);font-weight:800;font-size:13px;margin-bottom:6px}
.herocard .hp{font-weight:600;font-size:14.5px;margin-bottom:6px}.herocard .bar{margin-top:6px}
/* bosses */
.bossart{display:inline-block;width:110px;height:110px;flex:none;animation:bossBob 2.6s ease-in-out infinite}
.bossart svg{width:100%;height:100%;overflow:visible}.bossart.sm{width:58px;height:58px;animation:none}.bossart.big{width:150px;height:150px;margin:0 auto 6px;display:block}
.bossart.hit{animation:bossHit .45s ease}.bossart.dead{animation:none;filter:grayscale(1) opacity(.45);transform:rotate(-12deg) scale(.9)}
@keyframes bossBob{50%{transform:translateY(-6px)}}
@keyframes bossHit{0%{transform:none;filter:brightness(1)}20%{transform:translateX(-10px) rotate(-6deg);filter:brightness(2.2)}45%{transform:translateX(9px) rotate(5deg)}70%{transform:translateX(-5px)}100%{transform:none}}
.bossbar{display:flex;gap:14px;align-items:center;margin:6px 0 10px;padding:14px;border-radius:22px;background:var(--surface);border:2.5px solid var(--line)}
.bossinfo{flex:1;min-width:0}.bossinfo b{font-family:var(--f-display);font-size:24px;display:block}
.hpbar{position:relative;height:20px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#e11d48,#fb7185);border-radius:999px;transition:width .5s ease}
.hpbar span{position:relative;display:block;text-align:center;font-family:var(--f-mono);font-size:12px;font-weight:700;line-height:20px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.bhearts{font-size:18px;letter-spacing:2px}.bhearts i{font-style:normal;opacity:.6}.bhearts.ouch{animation:bossHit .45s ease}

.bosshero{border-radius:24px;padding:22px 20px;background:linear-gradient(120deg,#7f1d1d,#4c1d95);color:#fff;margin-bottom:14px;box-shadow:0 6px 0 #2e1065}
.bosshero h2{font-size:clamp(28px,6vw,36px);margin:4px 0}.bosshero p{margin:0;font-weight:700;opacity:.92}
.bosslist{display:grid;gap:12px}
.bossrow{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:20px;border:2.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.bossrow.open{border-color:#e11d48;box-shadow:0 4px 0 #e11d48}.bossrow.done{opacity:.85}.bossrow.locked{opacity:.5;cursor:not-allowed}
.bossrow.locked .bossart{filter:grayscale(1) brightness(.4)}
.bossrow .bn{font-family:var(--f-mono);font-weight:700;color:var(--muted);width:20px}
.bossrow .bt{flex:1;display:flex;flex-direction:column;gap:2px}.bossrow .bt b{font-size:18px}.bossrow .bt>span{color:var(--muted);font-weight:700;font-size:13.5px}
.bossrow .tags{display:flex;gap:6px;flex-wrap:wrap}.bossrow .tags em{font-style:normal;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface2,var(--bg));color:var(--ink)}
.bossrow .bd{font-weight:600!important;color:var(--ink)!important}
.bossrow .bs{font-size:24px}
.bossend.won{border-color:var(--good,#16a34a)}.bossend.lost{border-color:var(--bad)}

.boss-home,.bigbanner{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;text-align:left;padding:14px 16px;border-radius:20px;border:0;color:#fff;font:inherit;cursor:pointer}

.heroes-mini{display:flex}.heroes-mini i{width:34px;height:34px;margin-left:-8px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:0 0 0 2px rgba(255,255,255,.6)}.heroes-mini i svg{width:28px;height:28px}

.bigbanner{margin-top:0}.bigbanner.boss{background:linear-gradient(120deg,#9f1239,#5b21b6);box-shadow:0 5px 0 #3b0764}.bigbanner.heroes{background:linear-gradient(120deg,#0e7490,#15803d);box-shadow:0 5px 0 #14532d}
.card.backup{display:flex;gap:12px;align-items:center;margin-top:14px;border-color:var(--pop)}.card.backup>span{font-size:28px}.card.backup>div{flex:1}

.sctxt{width:100%;margin:10px 0;font-family:var(--f-mono);font-size:12.5px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);word-break:break-all;resize:vertical}
.scres{margin-top:14px}.scres summary{cursor:pointer;font-weight:800}.scmsg{margin-top:8px;font-weight:800}.scmsg.err{color:var(--bad)}.scmsg.ok{color:var(--ink)}

<script>
const DATA_ES={"topics":[{"c":"A1.1","n":"Japón: causas de la expansión","hl":false,"gq":["¿Por qué se expandió Japón tras 1931?","¿Pesó más la economía o el militarismo?"],"u":[{"c":"A1.1.1","t":"¿Cómo influyó la Gran Depresión en la expansión japonesa?","hl":false,"a":"Hundió las exportaciones de seda y desacreditó a los gobiernos civiles; Manchuria se vio como fuente de materias primas, mercados y tierra para colonos."},{"c":"A1.1.2","t":"¿Qué papel tuvo el militarismo?","hl":false,"a":"El ejército respondía al emperador, no al gabinete; oficiales ultranacionalistas asesinaron políticos (Inukai, 1932) y el Ejército de Kwantung actuó por su cuenta."},{"c":"A1.1.3","t":"¿Por qué la inestabilidad de China facilitó la expansión?","hl":false,"a":"China estaba dividida entre el GMD, los comunistas y los señores de la guerra; Chiang priorizaba combatir al PCCh, así que no resistió con fuerza."},{"c":"A1.1.4","t":"¿Qué resentimientos nacionalistas alimentaron la expansión?","hl":false,"a":"El rechazo de la cláusula de igualdad racial en París (1919), los límites navales de Washington (1922) y Londres (1930) y la ley de inmigración de EE. UU. (1924)."},{"c":"A1.1.5","t":"¿Qué era la «Esfera de Coprosperidad»?","hl":false,"a":"Proyecto japonés (1940) de un bloque asiático bajo su dirección, presentado como liberación del colonialismo occidental pero orientado a asegurar recursos."}]},{"c":"A1.2","n":"Japón: Manchuria, China y Pearl Harbor","hl":false,"gq":["¿Qué etapas tuvo la expansión japonesa?","¿Por qué terminó en guerra con EE. UU.?"],"u":[{"c":"A1.2.1","t":"¿Qué fue el incidente de Mukden (septiembre de 1931)?","hl":false,"a":"Explosión en el Ferrocarril del Sur de Manchuria provocada por oficiales japoneses y atribuida a China; pretexto para ocupar Manchuria."},{"c":"A1.2.2","t":"¿Qué fue Manchukuo (1932)?","hl":false,"a":"Estado títere en Manchuria con Puyi, último emperador Qing, como jefe nominal; Japón lo controlaba de hecho."},{"c":"A1.2.3","t":"¿Cómo empezó la guerra chino-japonesa de 1937?","hl":false,"a":"Con el incidente del puente Marco Polo (julio de 1937); Japón tomó Shanghái y Nanjing, donde cometió una masacre masiva de civiles."},{"c":"A1.2.4","t":"¿Qué fue el Pacto Tripartito (septiembre de 1940)?","hl":false,"a":"Alianza de Japón, Alemania e Italia: ayuda mutua si una potencia aún no implicada (en la práctica EE. UU.) atacaba a una de ellas."},{"c":"A1.2.5","t":"¿Por qué atacó Japón Pearl Harbor (7 de diciembre de 1941)?","hl":false,"a":"Para neutralizar la flota estadounidense del Pacífico y ganar tiempo para conquistar el sudeste asiático y su petróleo."},{"c":"A1.2.6","t":"¿Qué fue el Pacto Antikomintern (1936)?","hl":false,"a":"Acuerdo entre Alemania y Japón contra la Internacional Comunista; Italia se sumó en 1937. Primer paso de la alineación con el Eje."}]},{"c":"A1.3","n":"Japón: reacciones internacionales","hl":false,"gq":["¿Por qué falló la Sociedad de Naciones en Asia?","¿Cómo se deterioraron las relaciones con EE. UU.?"],"u":[{"c":"A1.3.1","t":"¿Qué concluyó el Informe Lytton (1932–1933)?","hl":false,"a":"Reconoció intereses japoneses en Manchuria pero condenó la agresión y no reconoció Manchukuo; Japón abandonó la Sociedad en 1933."},{"c":"A1.3.2","t":"¿Por qué la Sociedad no actuó contra Japón?","hl":false,"a":"Japón era miembro permanente del Consejo; Reino Unido y Francia no querían arriesgar sus intereses en Asia durante la Depresión; EE. UU. y la URSS no eran miembros."},{"c":"A1.3.3","t":"¿Qué fue el Segundo Frente Unido (1937)?","hl":false,"a":"Alianza GMD-PCCh contra Japón tras el incidente de Xi'an (diciembre de 1936), en que Chiang fue secuestrado; fue frágil y se rompió en la práctica en 1941."},{"c":"A1.3.4","t":"¿Qué fue la Doctrina Stimson (1932)?","hl":false,"a":"Política de EE. UU. de no reconocer cambios territoriales logrados por la fuerza, sin sanciones que la respaldaran."},{"c":"A1.3.5","t":"¿Cómo presionó EE. UU. a Japón entre 1939 y 1941?","hl":false,"a":"Fin del tratado comercial (1939), embargo de chatarra y combustible de aviación (1940) y congelación de activos con embargo petrolero (julio de 1941)."},{"c":"A1.3.6","t":"¿Qué fue la Nota Hull (noviembre de 1941)?","hl":false,"a":"Exigencia estadounidense de retirada japonesa de China e Indochina; Tokio la vio como un ultimátum y decidió atacar."}]},{"c":"A1.4","n":"Italia: Abisinia, Albania y entrada en guerra","hl":false,"gq":["¿Qué buscaba Mussolini?","¿Por qué fracasaron las sanciones?"],"u":[{"c":"A1.4.1","t":"¿Qué objetivos tenía Mussolini al invadir Abisinia?","hl":false,"a":"Prestigio y un imperio (una «nueva Roma»), vengar la derrota de Adua (1896), distraer de la crisis económica y obtener tierras y recursos."},{"c":"A1.4.2","t":"¿Qué fue el incidente de Walwal (diciembre de 1934)?","hl":false,"a":"Choque fronterizo entre tropas italianas y etíopes que Mussolini usó como pretexto; invadió en octubre de 1935."},{"c":"A1.4.3","t":"¿Qué fue el Frente de Stresa (abril de 1935)?","hl":false,"a":"Acuerdo de Reino Unido, Francia e Italia contra el rearme alemán; se rompió por el acuerdo naval anglo-alemán y por la crisis de Abisinia."},{"c":"A1.4.4","t":"¿Por qué fracasaron las sanciones y qué fue el plan Hoare-Laval?","hl":false,"a":"Las sanciones excluían el petróleo y el canal de Suez siguió abierto; el plan Hoare-Laval (diciembre de 1935) ofrecía a Italia gran parte de Abisinia y causó escándalo."},{"c":"A1.4.5","t":"¿Qué consecuencias tuvo la crisis de Abisinia?","hl":false,"a":"Italia conquistó el país (mayo de 1936) usando gas; se levantaron las sanciones, la Sociedad quedó desacreditada y nació el Eje Roma-Berlín (noviembre de 1936)."},{"c":"A1.4.6","t":"¿Cómo siguió la expansión italiana tras 1936?","hl":false,"a":"Apoyo a Franco, salida de la Sociedad (1937), ocupación de Albania (abril de 1939), Pacto de Acero (mayo de 1939) y entrada en la guerra el 10 de junio de 1940."}]},{"c":"A1.5","n":"Alemania: desafíos a Versalles (1933–1938)","hl":false,"gq":["¿Plan o improvisación de Hitler?","¿Por qué no se le detuvo antes?"],"u":[{"c":"A1.5.1","t":"¿Qué objetivos de política exterior tenía Hitler?","hl":false,"a":"Destruir Versalles, unir a todos los alemanes en una Gran Alemania, conseguir espacio vital (Lebensraum) en el Este y aplastar el comunismo."},{"c":"A1.5.2","t":"¿Qué desafíos planteó Alemania entre 1933 y 1935?","hl":false,"a":"Salida de la Conferencia de Desarme y de la Sociedad (octubre de 1933), plebiscito del Sarre (enero de 1935, 90 % pro-Alemania) y anuncio de la Luftwaffe y la conscripción (marzo de 1935)."},{"c":"A1.5.3","t":"¿Qué fue el Acuerdo naval anglo-alemán (junio de 1935)?","hl":false,"a":"Permitió a Alemania una flota del 35 % de la británica; Reino Unido aceptó así una violación de Versalles sin consultar a Francia ni a Italia."},{"c":"A1.5.4","t":"¿Qué fue la remilitarización de Renania (marzo de 1936)?","hl":false,"a":"Tropas alemanas entraron en la zona desmilitarizada violando Versalles y Locarno; Francia no actuó sin apoyo británico."},{"c":"A1.5.5","t":"¿Qué importancia tuvo la Guerra Civil española (1936–1939)?","hl":false,"a":"Alemania e Italia apoyaron a Franco (Legión Cóndor, bombardeo de Guernica en 1937); probaron armas y se acercaron mientras la No Intervención fracasaba."},{"c":"A1.5.6","t":"¿Qué fue el Anschluss (marzo de 1938)?","hl":false,"a":"Anexión de Austria tras presionar al canciller Schuschnigg; un plebiscito controlado dio un 99 % de apoyo. Violaba Versalles y no hubo respuesta."}]},{"c":"A1.6","n":"Alemania 1938–1940: Múnich, pactos y guerra","hl":false,"gq":["¿Por qué terminó el apaciguamiento?","¿Qué hizo posible la guerra en 1939?"],"u":[{"c":"A1.6.1","t":"¿Qué fue la crisis de los Sudetes (1938)?","hl":false,"a":"Hitler exigió la región checa con unos 3 millones de germanohablantes; Chamberlain se reunió con él en Berchtesgaden, Bad Godesberg y Múnich."},{"c":"A1.6.2","t":"¿Qué se acordó en Múnich (29–30 de septiembre de 1938)?","hl":false,"a":"Reino Unido, Francia, Alemania e Italia entregaron los Sudetes a Alemania sin Checoslovaquia ni la URSS; Chamberlain habló de «paz para nuestro tiempo»."},{"c":"A1.6.3","t":"¿Por qué marzo de 1939 acabó con el apaciguamiento?","hl":false,"a":"Alemania ocupó el resto de Checoslovaquia, territorio no alemán; Reino Unido y Francia garantizaron entonces la independencia de Polonia."},{"c":"A1.6.4","t":"¿Qué fue el Pacto de Acero (mayo de 1939)?","hl":false,"a":"Alianza militar entre Alemania e Italia; Mussolini advirtió que Italia no estaría lista para la guerra hasta 1942–1943."},{"c":"A1.6.5","t":"¿Qué fue el pacto germano-soviético (23 de agosto de 1939)?","hl":false,"a":"Pacto de no agresión con un protocolo secreto para repartir Polonia y el Báltico; libró a Hitler de una guerra en dos frentes."},{"c":"A1.6.6","t":"¿Cómo reaccionaron las potencias en 1940?","hl":false,"a":"Tras la caída de Francia (junio), Churchill rechazó negociar; EE. UU. dejó la neutralidad estricta (cambio de destructores por bases, septiembre de 1940) y luego el Préstamo y Arriendo (1941)."}]},{"c":"A1.7","n":"Sociedad de Naciones y apaciguamiento","hl":false,"gq":["¿Por qué fracasó la seguridad colectiva?","¿Fue el apaciguamiento un error?"],"u":[{"c":"A1.7.1","t":"¿Qué era la seguridad colectiva?","hl":false,"a":"Principio del Pacto de la Sociedad: un ataque a un miembro es un ataque a todos; dependía de sanciones y de la voluntad de las grandes potencias."},{"c":"A1.7.2","t":"¿Qué debilidades estructurales tenía la Sociedad de Naciones?","hl":false,"a":"Sin ejército propio, sin EE. UU., decisiones por unanimidad y salida de Japón (1933), Alemania (1933) e Italia (1937)."},{"c":"A1.7.3","t":"¿Por qué Reino Unido practicó el apaciguamiento?","hl":false,"a":"Recuerdo de la Primera Guerra Mundial, opinión pacifista, debilidad militar y económica, idea de que Versalles fue injusto, miedo al comunismo y dominios reacios a otra guerra."},{"c":"A1.7.4","t":"¿Qué postura tuvo Francia?","hl":false,"a":"Dividida políticamente, con mentalidad defensiva (Línea Maginot) y dependiente de Reino Unido: no actuaba sola."},{"c":"A1.7.5","t":"¿Qué política siguió EE. UU. en los años treinta?","hl":false,"a":"Aislacionismo: las Leyes de Neutralidad (1935–1937) prohibían vender armas a beligerantes; el «cash and carry» (1939) favoreció luego a los aliados."},{"c":"A1.7.6","t":"¿Qué papel tuvo la URSS?","hl":false,"a":"Entró en la Sociedad (1934) y defendió la seguridad colectiva con Litvinov; excluida en Múnich, lo sustituyó por Mólotov y pactó con Hitler."},{"c":"A1.7.7","t":"¿Qué dice el debate historiográfico sobre el apaciguamiento?","hl":false,"a":"La visión de «los culpables» (1940) lo condena como cobardía; los revisionistas lo ven como realismo que ganó tiempo para rearmarse; los post-revisionistas dicen que había alternativas."}]},{"c":"B2.1","n":"Hitler: ascenso al poder","hl":false,"gq":["¿Qué condiciones permitieron su ascenso?","¿Persuasión o coerción?"],"u":[{"c":"B2.1.1","t":"¿Qué debilidades de Weimar aprovechó Hitler?","hl":false,"a":"Representación proporcional con coaliciones inestables, artículo 48 (decretos de emergencia), el mito de la «puñalada por la espalda» y el rencor por Versalles."},{"c":"B2.1.2","t":"¿Qué efecto tuvo la Gran Depresión?","hl":false,"a":"El paro llegó a unos 6 millones (1932); los nazis pasaron del 2,6 % (1928) al 37,3 % (julio de 1932), primer partido del Reichstag."},{"c":"B2.1.3","t":"¿Qué métodos usó para ganar apoyo?","hl":false,"a":"Propaganda moderna (Goebbels), mítines, mensajes adaptados a cada grupo social, violencia de las SA contra comunistas y promesas de orden y empleo."},{"c":"B2.1.4","t":"¿Cómo llegó a canciller (30 de enero de 1933)?","hl":false,"a":"Por una intriga de élites: Papen convenció a Hindenburg de nombrarlo creyendo que podrían controlarlo. Llegó legalmente, no por golpe."},{"c":"B2.1.5","t":"¿Qué lección le dejó el Putsch de Múnich (1923)?","hl":false,"a":"Que debía llegar al poder por vías legales; el juicio le dio publicidad y en prisión escribió Mein Kampf."}]},{"c":"B2.2","n":"Hitler: consolidación y mantenimiento del poder","hl":false,"gq":["¿Métodos legales o fuerza?","¿Qué alcance tuvo la oposición?"],"u":[{"c":"B2.2.1","t":"¿Qué fue el incendio del Reichstag (febrero de 1933)?","hl":false,"a":"Hitler culpó a los comunistas; el decreto del incendio suspendió libertades civiles y permitió arrestar a miles de opositores."},{"c":"B2.2.2","t":"¿Qué fue la Ley de Habilitación (marzo de 1933)?","hl":false,"a":"Aprobada con apoyo del Zentrum y sin los comunistas (arrestados); permitía al gobierno legislar sin el Reichstag durante cuatro años."},{"c":"B2.2.3","t":"¿Qué fue la Gleichschaltung?","hl":false,"a":"La «coordinación» de la sociedad: sindicatos abolidos (mayo de 1933), partidos prohibidos (julio de 1933) y estados regionales sometidos."},{"c":"B2.2.4","t":"¿Qué fue la Noche de los cuchillos largos (junio de 1934)?","hl":false,"a":"Las SS asesinaron a Röhm, a líderes de las SA y a rivales; Hitler ganó al ejército. Al morir Hindenburg (agosto) se proclamó Führer y el ejército le juró lealtad."},{"c":"B2.2.5","t":"¿Qué instrumentos de terror usó?","hl":false,"a":"SS (Himmler), Gestapo, campos de concentración (Dachau, 1933) y tribunales especiales; muchas detenciones partían de denuncias ciudadanas."},{"c":"B2.2.6","t":"¿Cómo funcionaba la propaganda?","hl":false,"a":"Ministerio de Goebbels: radios baratas, cine (Riefenstahl), mítines de Núremberg, quema de libros (1933) y Juegos Olímpicos de 1936."},{"c":"B2.2.7","t":"¿Qué alcance tuvo la oposición?","hl":false,"a":"Limitada y fragmentada: Iglesia Confesional (Niemöller), obispo Galen, comunistas clandestinos y jóvenes (Rosa Blanca, Piratas de Edelweiss)."},{"c":"B2.2.8","t":"¿Cómo ayudó la política exterior a mantener el poder?","hl":false,"a":"Éxitos sin guerra (Sarre, Renania, Anschluss, Múnich) dispararon la popularidad de Hitler."}]},{"c":"B2.3","n":"Hitler: políticas internas","hl":false,"gq":["¿Qué lograron las políticas económicas?","¿Cómo afectaron a mujeres y minorías?"],"u":[{"c":"B2.3.1","t":"¿Cómo bajó el paro bajo el nazismo?","hl":false,"a":"Obras públicas (autopistas), rearme, conscripción y Servicio de Trabajo; las cifras se maquillaban excluyendo a mujeres y judíos."},{"c":"B2.3.2","t":"¿Qué fue el Plan Cuatrienal (1936)?","hl":false,"a":"Plan de Göring para preparar la economía para la guerra mediante la autarquía; sustituyó el enfoque más prudente de Schacht (Nuevo Plan, letras Mefo)."},{"c":"B2.3.3","t":"¿Cómo trató el régimen a los obreros?","hl":false,"a":"El Frente Alemán del Trabajo sustituyó a los sindicatos; «Fuerza por la Alegría» ofrecía ocio barato; los salarios reales apenas mejoraron."},{"c":"B2.3.4","t":"¿Qué política aplicó hacia las mujeres?","hl":false,"a":"Kinder, Küche, Kirche: préstamos matrimoniales, Cruz de Honor de la Madre y exclusión de la judicatura; desde 1937 volvieron a las fábricas por el rearme."},{"c":"B2.3.5","t":"¿Cómo adoctrinó a la juventud?","hl":false,"a":"Juventudes Hitlerianas y Liga de Muchachas Alemanas (obligatorias desde 1936–1939) y una escuela nazificada con biología racial."},{"c":"B2.3.6","t":"¿Cómo persiguió a judíos y otras minorías?","hl":false,"a":"Boicot (1933), Leyes de Núremberg (1935), Noche de los Cristales Rotos (1938); esterilización forzosa (1933), programa T4 (1939) y persecución de gitanos y homosexuales."},{"c":"B2.3.7","t":"¿Qué relación tuvo con las Iglesias?","hl":false,"a":"Concordato con el Vaticano (1933) y una Iglesia del Reich protestante; la encíclica Mit brennender Sorge (1937) criticó al régimen."}]},{"c":"B2.4","n":"Mao: ascenso y consolidación","hl":false,"gq":["¿Por qué triunfó Mao?","¿Cómo eliminó la oposición tras 1949?"],"u":[{"c":"B2.4.1","t":"¿Qué condiciones favorecieron el ascenso de Mao?","hl":false,"a":"Guerra civil, invasión japonesa, corrupción e hiperinflación del GMD y un campesinado pobre al que el PCCh movilizó con la reforma agraria."},{"c":"B2.4.2","t":"¿Qué fue el Movimiento de Rectificación (1942–1944)?","hl":false,"a":"Campaña en Yan'an que impuso el pensamiento de Mao, eliminó rivales internos y creó su culto a la personalidad."},{"c":"B2.4.3","t":"¿Cómo consolidó el poder entre 1950 y 1953?","hl":false,"a":"Reforma agraria violenta contra terratenientes (entre 1 y 2 millones de muertos), campañas de los Tres Anti y Cinco Anti, ocupación del Tíbet y Guerra de Corea."},{"c":"B2.4.4","t":"¿Qué fue la Campaña de las Cien Flores (1956–1957)?","hl":false,"a":"Mao invitó a criticar al partido; ante la avalancha de críticas lanzó la Campaña Antiderechista, que persiguió a cientos de miles de intelectuales."},{"c":"B2.4.5","t":"¿Cómo se mantuvo el control social?","hl":false,"a":"Laogai (campos de trabajo), vigilancia mediante las unidades de trabajo, propaganda masiva y culto a la personalidad (Libro Rojo, 1964)."},{"c":"B2.4.6","t":"¿Cómo influyó la Guerra de Corea (1950–1953)?","hl":false,"a":"Movilizó el nacionalismo antiestadounidense y justificó campañas contra «contrarrevolucionarios»; reforzó la imagen de Mao."}]},{"c":"B2.5","n":"Mao: políticas internas","hl":false,"gq":["¿Qué impacto tuvieron sus políticas?","¿Cambió la vida de las mujeres?"],"u":[{"c":"B2.5.1","t":"¿Qué fue el Primer Plan Quinquenal (1953–1957)?","hl":false,"a":"Plan de modelo soviético centrado en la industria pesada con ayuda de la URSS; la producción industrial creció con fuerza."},{"c":"B2.5.2","t":"¿Qué fue el Gran Salto Adelante (1958–1962)?","hl":false,"a":"Comunas populares, hornos de patio y cuotas imposibles; con cifras falsas y requisas de grano provocó una hambruna de decenas de millones de muertos."},{"c":"B2.5.3","t":"¿Qué pasó en la conferencia de Lushan (1959)?","hl":false,"a":"Peng Dehuai criticó el Gran Salto y fue purgado; nadie se atrevió a frenar la política y la hambruna empeoró."},{"c":"B2.5.4","t":"¿Qué fue la Revolución Cultural (1966–1976)?","hl":false,"a":"Mao movilizó a los Guardias Rojos contra los «Cuatro Viejos» y rivales (Liu Shaoqi, Deng Xiaoping) para recuperar poder; caos, violencia y cierre de universidades."},{"c":"B2.5.5","t":"¿Qué cambió para las mujeres?","hl":false,"a":"La Ley de Matrimonio (1950) prohibió matrimonios concertados y concubinato y permitió el divorcio; trabajaron más, pero con doble carga y desigualdad persistente."},{"c":"B2.5.6","t":"¿Cómo trató el régimen a minorías y religiones?","hl":false,"a":"Ocupó el Tíbet (1950) y aplastó la rebelión de 1959; persiguió las religiones, sobre todo en la Revolución Cultural."},{"c":"B2.5.7","t":"¿Qué políticas culturales y educativas aplicó?","hl":false,"a":"Alfabetización y caracteres simplificados; cultura politizada al servicio del partido (óperas modelo de Jiang Qing)."}]},{"c":"C3.1","n":"Guerra civil rusa: causas y bandos","hl":false,"gq":["¿Por qué estalló la guerra?","¿Quiénes lucharon?"],"u":[{"c":"C3.1.1","t":"¿Qué hechos desencadenaron la guerra civil rusa?","hl":false,"a":"La disolución de la Asamblea Constituyente (enero de 1918), donde ganaron los eseristas; el Tratado de Brest-Litovsk (marzo de 1918) y la revuelta de la Legión Checa (mayo de 1918)."},{"c":"C3.1.2","t":"¿Quiénes formaban los bandos?","hl":false,"a":"Rojos (bolcheviques, Ejército Rojo de Trotski); Blancos (Kolchak en Siberia, Denikin en el sur, Yudenich en el noroeste, Wrangel en Crimea); Verdes (campesinos como Majnó)."},{"c":"C3.1.3","t":"¿Qué causas a largo plazo tuvo?","hl":false,"a":"La polarización social de 1917, los nacionalismos de la periferia, el hundimiento económico por la guerra mundial y el rechazo a la dictadura bolchevique."},{"c":"C3.1.4","t":"¿Qué potencias intervinieron?","hl":false,"a":"Reino Unido, Francia, EE. UU., Japón y otras enviaron tropas (Múrmansk, Arcángel, Vladivostok); objetivos limitados y poco coordinados."},{"c":"C3.1.5","t":"¿Qué tipo de guerra fue?","hl":false,"a":"Guerra civil con elementos de lucha de clases, guerras nacionales (Ucrania, Polonia en 1920) y terror de ambos bandos."}]},{"c":"C3.2","n":"Guerra civil rusa: victoria roja y consecuencias","hl":false,"gq":["¿Por qué ganaron los rojos?","¿Qué consecuencias tuvo?"],"u":[{"c":"C3.2.1","t":"¿Por qué ganaron los rojos?","hl":false,"a":"Controlaban el centro industrial y ferroviario, tenían mando unificado, la disciplina de Trotski, el comunismo de guerra y la Cheka."},{"c":"C3.2.2","t":"¿Cuáles fueron las debilidades de los blancos?","hl":false,"a":"Divididos entre monárquicos y liberales, sin programa común, ejércitos separados por grandes distancias y temidos por los campesinos."},{"c":"C3.2.3","t":"¿Qué límites tuvo la intervención extranjera?","hl":false,"a":"Tropas cansadas de la guerra mundial, objetivos dispares y retirada en 1919–1920; dio a los bolcheviques propaganda patriótica."},{"c":"C3.2.4","t":"¿Cómo usó Trotski a los oficiales zaristas?","hl":false,"a":"Reclutó a unos 50 000 «especialistas militares» vigilados por comisarios políticos y retuvo a sus familias como garantía."},{"c":"C3.2.5","t":"¿Qué consecuencias tuvo la guerra?","hl":false,"a":"Millones de muertos por combate, hambre (1921–1922) y epidemias; un partido más centralizado y militarizado; Kronstadt, NEP y creación de la URSS (diciembre de 1922)."}]},{"c":"C3.3","n":"Guerra civil china: causas y fases","hl":false,"gq":["¿Qué causas tuvo la guerra?","¿Cómo cambió en cada fase?"],"u":[{"c":"C3.3.1","t":"¿Qué causas a largo plazo tuvo la guerra civil china?","hl":false,"a":"Caída de los Qing (1911), época de los señores de la guerra, pobreza campesina, humillación extranjera y dos proyectos rivales: nacionalismo del GMD y comunismo del PCCh."},{"c":"C3.3.2","t":"¿Cómo terminó el Primer Frente Unido?","hl":false,"a":"La alianza GMD-PCCh (1923–1927) con apoyo soviético acabó cuando Chiang masacró a los comunistas en Shanghái (abril de 1927)."},{"c":"C3.3.3","t":"¿Qué pasó en la fase 1927–1936?","hl":false,"a":"Soviet de Jiangxi, campañas de cerco del GMD y Larga Marcha (1934–1935, unos 10 000 km, pocos supervivientes); Mao gana el liderazgo en Zunyi (1935)."},{"c":"C3.3.4","t":"¿Qué pasó en la fase 1937–1945?","hl":false,"a":"Segundo Frente Unido contra Japón; el GMD soportó las grandes batallas y se desgastó; el PCCh creció con guerrillas y bases rurales (de unos 40 000 a más de un millón de miembros)."},{"c":"C3.3.5","t":"¿Qué pasó en la fase 1945–1949?","hl":false,"a":"Fracasó la mediación de EE. UU. (misión Marshall, 1946); el PCCh venció en Manchuria y en Huaihai (1948–1949); 1 de octubre de 1949, República Popular."}]},{"c":"C3.4","n":"Guerra civil china: victoria del PCCh y consecuencias","hl":false,"gq":["¿Por qué ganó el PCCh?","¿Qué papel tuvieron las potencias extranjeras?"],"u":[{"c":"C3.4.1","t":"¿Qué fortalezas tuvo el PCCh?","hl":false,"a":"Reforma agraria, disciplina del Ejército Popular de Liberación, paso de la guerrilla a grandes batallas (Lin Biao), propaganda eficaz y armas japonesas capturadas en Manchuria."},{"c":"C3.4.2","t":"¿Qué debilidades tuvo el GMD?","hl":false,"a":"Corrupción, hiperinflación, represión, reclutamiento forzoso, mandos incompetentes y pérdida del apoyo urbano."},{"c":"C3.4.3","t":"¿Qué papel tuvieron EE. UU. y la URSS?","hl":false,"a":"EE. UU. dio miles de millones al GMD pero sin enviar tropas de combate; la URSS facilitó al PCCh armas japonesas en Manchuria (1945–1946), aunque Stalin desconfiaba de Mao."},{"c":"C3.4.4","t":"¿Qué consecuencias tuvo la victoria comunista?","hl":false,"a":"República Popular China (1949), GMD en Taiwán, alianza chino-soviética (1950), entrada en la Guerra de Corea y reforma agraria violenta; en EE. UU., debate sobre la «pérdida de China»."}]},{"c":"D4.1","n":"Alejandro II y Alejandro III","hl":true,"gq":["¿Qué alcance tuvieron las reformas de Alejandro II?","¿Modernización sin cambio político?"],"u":[{"c":"D4.1.1","t":"¿Por qué reformó Alejandro II?","hl":false,"a":"La derrota en la Guerra de Crimea (1853–1856) mostró el atraso ruso; mejor abolir la servidumbre desde arriba que esperar a que se aboliera desde abajo."},{"c":"D4.1.2","t":"¿Qué fue la emancipación de los siervos (1861)?","hl":false,"a":"Liberó a unos 23 millones de siervos privados (luego a los estatales), pero con tierras peores, pagos de redención a 49 años y sujeción al mir."},{"c":"D4.1.3","t":"¿Qué otras reformas hizo Alejandro II?","hl":false,"a":"Zemstvos (1864), reforma judicial con jurados (1864), reforma militar de Miliutin (1874), menos censura y universidades más autónomas."},{"c":"D4.1.4","t":"¿Qué límites tuvieron sus reformas?","hl":false,"a":"No hubo participación política; tras el atentado de 1866 se volvió más conservador. Fue asesinado por Voluntad del Pueblo en 1881."},{"c":"D4.1.5","t":"¿Qué política aplicó Alejandro III (1881–1894)?","hl":false,"a":"Contrarreformas con Pobedonostsev: Okhrana, capitanes de la tierra (1889), rusificación y leyes de mayo contra los judíos (1882)."},{"c":"D4.1.6","t":"¿Qué hizo Witte (ministro de Finanzas 1892–1903)?","hl":false,"a":"Patrón oro (1897), préstamos franceses y Transiberiano; industrialización rápida a costa de impuestos sobre campesinos y duras condiciones obreras."}]},{"c":"D4.2","n":"Nicolás II, 1905, Stolypin y las Dumas","hl":true,"gq":["¿Por qué sobrevivió el zarismo a 1905?","¿Estabilizó Stolypin a Rusia?"],"u":[{"c":"D4.2.1","t":"¿Qué causó la Revolución de 1905?","hl":false,"a":"Hambre de tierra, malas condiciones obreras, oposición liberal y revolucionaria y la derrota ante Japón (Tsushima, mayo de 1905)."},{"c":"D4.2.2","t":"¿Qué fue el Domingo Sangriento (22 de enero de 1905)?","hl":false,"a":"Las tropas dispararon contra una marcha pacífica dirigida por el padre Gapón; destruyó la imagen del zar como «padrecito»."},{"c":"D4.2.3","t":"¿Por qué sobrevivió el zarismo en 1905?","hl":false,"a":"El Manifiesto de Octubre dividió a la oposición, el ejército siguió leal tras la paz de Portsmouth y se reprimió al Sóviet de San Petersburgo."},{"c":"D4.2.4","t":"¿Cómo limitó el zar a las Dumas?","hl":false,"a":"Leyes Fundamentales (1906) con veto y el artículo 87; disolvió las dos primeras Dumas y cambió la ley electoral (1907) para tener Dumas dóciles."},{"c":"D4.2.5","t":"¿Qué hizo Stolypin (1906–1911)?","hl":false,"a":"Reforma agraria para crear campesinos propietarios y migración a Siberia, combinada con dura represión; solo una minoría dejó la comuna. Asesinado en 1911."},{"c":"D4.2.6","t":"¿Creció la oposición antes de 1914?","hl":false,"a":"Sí: la masacre del Lena (1912) desató una ola de huelgas entre 1912 y 1914."}]},{"c":"D4.3","n":"1917: guerra, Febrero y Octubre","hl":true,"gq":["¿Fue la guerra la causa principal de la caída del zar?","¿Por qué triunfaron los bolcheviques?"],"u":[{"c":"D4.3.1","t":"¿Qué impacto tuvo la Primera Guerra Mundial en Rusia?","hl":false,"a":"Derrotas (Tannenberg), millones de bajas, inflación y escasez en las ciudades; el zar asumió el mando (1915) y Rasputín y la zarina desacreditaron al gobierno."},{"c":"D4.3.2","t":"¿Qué ocurrió en la Revolución de Febrero (1917)?","hl":false,"a":"Huelgas, el Día de la Mujer y el motín de la guarnición de Petrogrado; generales y diputados presionaron y Nicolás II abdicó en marzo."},{"c":"D4.3.3","t":"¿Qué fue el poder dual?","hl":false,"a":"La rivalidad entre el Gobierno Provisional (Lvov, luego Kérenski), sin mandato popular, y el Sóviet de Petrogrado; la Orden n.º 1 dio al Sóviet control del ejército."},{"c":"D4.3.4","t":"¿Qué errores cometió el Gobierno Provisional?","hl":false,"a":"Siguió en la guerra (ofensiva de junio), aplazó la reforma agraria y las elecciones; ante el golpe de Kornílov (agosto) armó a los bolcheviques."},{"c":"D4.3.5","t":"¿Qué proponían las Tesis de Abril de Lenin?","hl":false,"a":"«Paz, pan y tierra» y «todo el poder a los sóviets»; ningún apoyo al Gobierno Provisional."},{"c":"D4.3.6","t":"¿Cómo fue la Revolución de Octubre?","hl":false,"a":"El Comité Militar Revolucionario de Trotski tomó Petrogrado (25 de octubre / 7 de noviembre de 1917) con escasa resistencia."}]},{"c":"D4.4","n":"La Rusia de Lenin (1917–1924)","hl":true,"gq":["¿Cómo consolidó Lenin el Estado soviético?","¿Terror o concesiones?"],"u":[{"c":"D4.4.1","t":"¿Cuáles fueron las primeras medidas bolcheviques?","hl":false,"a":"Decretos sobre la Paz y sobre la Tierra, gobierno del Sovnarkom, control obrero y disolución de la Asamblea Constituyente (enero de 1918)."},{"c":"D4.4.2","t":"¿Qué perdió Rusia en Brest-Litovsk (marzo de 1918)?","hl":false,"a":"Ucrania, Polonia, el Báltico y Finlandia: cerca de un tercio de su población y la mayor parte de su carbón. Lenin lo aceptó para salvar la revolución."},{"c":"D4.4.3","t":"¿Qué fue el comunismo de guerra (1918–1921)?","hl":false,"a":"Requisas de grano, nacionalización de la industria, prohibición del comercio privado y trabajo obligatorio; causó hambre y revueltas como Tambov."},{"c":"D4.4.4","t":"¿Qué fueron la Cheka y el Terror Rojo?","hl":false,"a":"Policía política de Dzerzhinski (diciembre de 1917); el Terror Rojo se intensificó tras el atentado contra Lenin (agosto de 1918). Los Romanov fueron ejecutados en julio de 1918."},{"c":"D4.4.5","t":"¿Qué fueron Kronstadt y la NEP (1921)?","hl":false,"a":"Los marineros de Kronstadt se rebelaron; la NEP cambió requisas por un impuesto en especie y permitió el comercio y la pequeña empresa privada, con el Estado al mando de la industria clave."},{"c":"D4.4.6","t":"¿Qué decidió el X Congreso del partido (1921)?","hl":false,"a":"Adoptó la NEP y prohibió las facciones internas, reforzando la dictadura del partido."},{"c":"D4.4.7","t":"¿Qué política exterior siguió Lenin?","hl":false,"a":"Comintern (1919), guerra con Polonia (1920, paz de Riga 1921), tratado comercial anglo-soviético (1921) y Tratado de Rapallo con Alemania (1922)."},{"c":"D4.4.8","t":"¿Cómo terminó la etapa de Lenin?","hl":false,"a":"Se creó la URSS (diciembre de 1922); Lenin murió en enero de 1924 tras advertir en su Testamento contra Stalin."}]},{"c":"D4.5","n":"Diplomacia 1871–1914 y Guillermo II","hl":true,"gq":["¿Cómo cambió el equilibrio de poder?","¿Qué efecto tuvo la Weltpolitik?"],"u":[{"c":"D4.5.1","t":"¿Cuál era el sistema de Bismarck (1871–1890)?","hl":false,"a":"Aislar a Francia: Liga de los Tres Emperadores (1873/1881), Dúplice Alianza con Austria-Hungría (1879), Triple Alianza con Italia (1882) y Tratado de Reaseguro con Rusia (1887)."},{"c":"D4.5.2","t":"¿Qué fue el Congreso de Berlín (1878)?","hl":false,"a":"Revisó el Tratado de San Stefano, redujo la Gran Bulgaria y dio a Austria-Hungría la administración de Bosnia; Rusia quedó resentida."},{"c":"D4.5.3","t":"¿Qué fue la Weltpolitik de Guillermo II?","hl":false,"a":"Tras despedir a Bismarck (1890) no renovó el Reaseguro; buscó «un lugar bajo el sol» con la flota de Tirpitz (leyes navales de 1898 y 1900) y colonias."},{"c":"D4.5.4","t":"¿Cómo respondieron las demás potencias?","hl":false,"a":"Alianza franco-rusa (1894), Entente Cordial (1904) y Entente anglo-rusa (1907): la Triple Entente."},{"c":"D4.5.5","t":"¿Qué fueron las crisis marroquíes?","hl":false,"a":"Tánger (1905, conferencia de Algeciras en 1906) y Agadir (1911); Alemania quiso romper la Entente y la reforzó."},{"c":"D4.5.6","t":"¿Qué factores internos influían en la política exterior alemana?","hl":false,"a":"Un SPD en auge (primer partido en 1912) frente a élites conservadoras; según Wehler y Fischer, la Weltpolitik buscaba unir a la nación y frenar el socialismo."},{"c":"D4.5.7","t":"¿Cómo afectó el imperialismo a la diplomacia?","hl":false,"a":"Conferencia de Berlín (1884–1885), Fashoda (1898) y rivalidades en Asia; resolver disputas coloniales permitió las ententes de 1904 y 1907."}]},{"c":"D4.6","n":"Causas de la Primera Guerra Mundial y crisis de julio","hl":true,"gq":["¿Qué causas pesaron más?","¿Quién fue responsable?"],"u":[{"c":"D4.6.1","t":"¿Cuáles fueron las causas a largo plazo?","hl":false,"a":"Militarismo, alianzas, imperialismo y nacionalismo, más el declive otomano, que abrió un vacío de poder en los Balcanes."},{"c":"D4.6.2","t":"¿Cómo fue la carrera armamentista?","hl":false,"a":"Naval anglo-alemana (dreadnought, 1906) y terrestre (ley militar alemana de 1913, ley francesa de tres años, gran programa ruso), con planes rígidos como el Schlieffen."},{"c":"D4.6.3","t":"¿Qué crisis balcánicas precedieron a 1914?","hl":false,"a":"La anexión austriaca de Bosnia (1908–1909) humilló a Rusia y Serbia; las Guerras Balcánicas (1912–1913) fortalecieron a Serbia."},{"c":"D4.6.4","t":"¿Cuál fue la secuencia de la crisis de julio de 1914?","hl":false,"a":"28 jun: asesinato en Sarajevo; 5–6 jul: «cheque en blanco» alemán; 23 jul: ultimátum; 28 jul: guerra a Serbia; 30 jul: movilización rusa; 1–4 ago: Alemania declara guerra a Rusia y Francia, invade Bélgica y entra Reino Unido."},{"c":"D4.6.5","t":"¿Por qué el Plan Schlieffen generalizó la guerra?","hl":false,"a":"Exigía atacar Francia por Bélgica antes de que Rusia movilizara; convirtió una crisis balcánica en guerra general y arrastró a Reino Unido."},{"c":"D4.6.6","t":"¿Qué dice el debate historiográfico?","hl":false,"a":"Fischer (1961): Alemania buscó deliberadamente la guerra; Clark (2012): responsabilidad compartida de todas las potencias; Lloyd George: Europa «se deslizó» a la guerra."}]},{"c":"D4.7","n":"Civiles en la guerra y derrota de las potencias centrales","hl":true,"gq":["¿Cómo afectó la guerra a los civiles?","¿Por qué perdió Alemania?"],"u":[{"c":"D4.7.1","t":"¿Cómo afectó la guerra a los civiles británicos?","hl":false,"a":"Reclutamiento obligatorio (1916), ley DORA (censura y controles), racionamiento (1918), mujeres en fábricas de munición y voto femenino para mayores de 30 años (1918)."},{"c":"D4.7.2","t":"¿Cómo afectó la guerra a los civiles alemanes?","hl":false,"a":"Bloqueo británico, «invierno de los nabos» (1916–1917), cientos de miles de muertes por desnutrición, inflación, Programa Hindenburg y huelgas (1918)."},{"c":"D4.7.3","t":"¿Qué errores estratégicos cometió Alemania?","hl":false,"a":"Fracaso del Plan Schlieffen (Marne, 1914), Verdún (1916), guerra submarina sin restricciones (1917), que trajo a EE. UU., y la Ofensiva de primavera (1918)."},{"c":"D4.7.4","t":"¿Qué factores económicos explican la derrota?","hl":false,"a":"Bloqueo aliado, superioridad aliada en recursos y producción, y aliados débiles que Alemania debía sostener (Austria-Hungría, Otomanos, Bulgaria)."},{"c":"D4.7.5","t":"¿Qué papel tuvo EE. UU.?","hl":false,"a":"Entró en abril de 1917 por la guerra submarina y el telegrama Zimmermann; préstamos, recursos y unos 2 millones de soldados en Francia en 1918."},{"c":"D4.7.6","t":"¿Qué inestabilidad interna precipitó el final?","hl":false,"a":"Colapso de Bulgaria y Austria-Hungría, motines de Kiel (noviembre de 1918), revolución, abdicación del káiser (9 nov) y armisticio (11 nov)."}]},{"c":"D4.8","n":"Alemania de Weimar (1918–1933)","hl":true,"gq":["¿Por qué sobrevivió Weimar a 1918–1923?","¿Fueron dorados los años veinte?"],"u":[{"c":"D4.8.1","t":"¿Qué debilidades tenía la Constitución de Weimar (1919)?","hl":false,"a":"Representación proporcional pura (coaliciones débiles), un presidente con el artículo 48 y élites (ejército, jueces, funcionarios) hostiles a la república."},{"c":"D4.8.2","t":"¿Qué dificultades tuvo entre 1918 y 1923?","hl":false,"a":"Versalles y la «puñalada por la espalda», levantamiento espartaquista (1919), putsch de Kapp (1920), asesinatos políticos (Rathenau, 1922), ocupación del Ruhr, hiperinflación y putsch de Múnich (1923)."},{"c":"D4.8.3","t":"¿Qué causó la hiperinflación de 1923?","hl":false,"a":"La deuda de guerra, las reparaciones y la impresión de dinero para pagar la resistencia pasiva en el Ruhr; arruinó los ahorros de la clase media."},{"c":"D4.8.4","t":"¿Qué logró la era Stresemann (1924–1929)?","hl":false,"a":"Rentenmark (1923), Plan Dawes (1924), Locarno (1925), ingreso en la Sociedad (1926) y Plan Young (1929); prosperidad dependiente de préstamos de EE. UU."},{"c":"D4.8.5","t":"¿Qué ocurrió entre 1929 y 1933?","hl":false,"a":"Crac de Wall Street, retirada de préstamos y paro masivo; Brüning gobernó por decreto y la política se polarizó entre nazis y comunistas."},{"c":"D4.8.6","t":"¿Por qué sobrevivió Weimar a la crisis de 1918–1923?","hl":false,"a":"Pacto Ebert-Groener con el ejército, divisiones de sus enemigos, huelga general contra Kapp y apoyo de los partidos moderados."}]},{"c":"D4.9","n":"Italia de Mussolini (1918–1939)","hl":true,"gq":["¿Por qué llegó al poder?","¿Fue el fascismo un Estado totalitario?"],"u":[{"c":"D4.9.1","t":"¿Qué condiciones favorecieron el ascenso de Mussolini?","hl":false,"a":"La «victoria mutilada» (Fiume, D'Annunzio), crisis económica, Bienio Rojo (1919–1920), gobiernos liberales débiles y miedo de las élites al socialismo."},{"c":"D4.9.2","t":"¿Qué fue la Marcha sobre Roma (octubre de 1922)?","hl":false,"a":"Una amenaza de golpe; el rey Víctor Manuel III se negó a declarar el estado de sitio y nombró a Mussolini primer ministro."},{"c":"D4.9.3","t":"¿Cómo consolidó el poder (1923–1928)?","hl":false,"a":"Ley Acerbo (1923), asesinato de Matteotti (1924) y secesión del Aventino, leyes fascistísimas (1925–1926) y partido único."},{"c":"D4.9.4","t":"¿Qué fueron los Pactos de Letrán (1929)?","hl":false,"a":"Reconocieron el Vaticano como Estado y el catolicismo como religión oficial; Mussolini ganó el apoyo de la Iglesia."},{"c":"D4.9.5","t":"¿Qué políticas económicas aplicó?","hl":false,"a":"Batalla del Trigo (1925), revaluación de la lira (cuota 90, 1927), Batalla de los Nacimientos, Estado corporativo, IRI (1933) y autarquía tras Abisinia."},{"c":"D4.9.6","t":"¿Qué naturaleza tuvo el Estado fascista?","hl":false,"a":"Totalitarismo proclamado pero imperfecto: el rey, la Iglesia y las élites conservaron poder; culto al Duce, OVRA y destierro interno de opositores."}]},{"c":"D4.10","n":"España (1918–1939)","hl":true,"gq":["¿Por qué estalló la guerra civil?","¿Por qué ganó Franco?"],"u":[{"c":"D4.10.1","t":"¿Cuál era la situación de España antes de 1923?","hl":false,"a":"Monarquía de Alfonso XIII con caciquismo, latifundios en el sur, conflicto social (CNT anarquista, UGT socialista), nacionalismos catalán y vasco y desastre de Annual (1921)."},{"c":"D4.10.2","t":"¿Qué fue el régimen de Primo de Rivera (1923–1930)?","hl":false,"a":"Dictadura con apoyo del rey: obras públicas y fin de la guerra de Marruecos, pero perdió apoyos con la crisis de 1929; cayó en 1930 y la monarquía en 1931."},{"c":"D4.10.3","t":"¿Qué etapas tuvo la Segunda República?","hl":false,"a":"Bienio reformista (1931–1933, Azaña): reforma agraria, laicismo, reforma militar y estatuto catalán. Bienio radical-cedista (1933–1935, CEDA de Gil Robles): frenó reformas; revolución de Asturias (1934)."},{"c":"D4.10.4","t":"¿Qué precipitó la guerra en 1936?","hl":false,"a":"Victoria del Frente Popular (febrero), violencia y ocupaciones de tierras, asesinato de Calvo Sotelo (13 de julio) y golpe militar del 17–18 de julio."},{"c":"D4.10.5","t":"¿Qué participación extranjera hubo?","hl":false,"a":"Alemania (Legión Cóndor) e Italia (tropas voluntarias) ayudaron a Franco; la URSS y las Brigadas Internacionales a la República; Reino Unido y Francia impulsaron la No Intervención."},{"c":"D4.10.6","t":"¿Por qué ganó Franco?","hl":false,"a":"Mando unificado (Decreto de Unificación, 1937), ayuda germano-italiana más eficaz, el ejército de África y las divisiones republicanas (mayo de 1937 en Barcelona); fin el 1 de abril de 1939."}]}],"mcq":[{"qid":0,"new":false,"t":"A1.1","s":["¿Qué factor económico empujó a Japón hacia Manchuria tras 1929?"],"o":["El fin de las reparaciones que China pagaba a Japón","La caída de exportaciones por la Gran Depresión","El exceso de petróleo disponible en las islas japonesas","La exigencia británica de abrir mercados asiáticos"],"a":"B","ex":"La Depresión hundió la seda y el comercio; Manchuria prometía recursos y mercados propios.","hl":false},{"qid":1,"new":false,"t":"A1.1","s":["¿Qué reveló el incidente de Mukden sobre el sistema político japonés?"],"o":["Que el emperador dirigía en persona las operacio
