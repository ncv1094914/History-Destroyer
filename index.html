/* ---------- calculation gym ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const ch=a=>a[Math.floor(Math.random()*a.length)];
const rd=(v,dp)=>{const f=Math.pow(10,dp);return Math.round(v*f)/f;};
const nf=(v,dp)=>{const s=dp==null?String(v):rd(v,dp).toFixed(dp);return LANG==="es"?s.replace(".",","):s;};
const nfi=v=>{const x=Math.round(Number(v)*1000)/1000;const [i,d]=String(Math.abs(x)).split(".");const g=i.length>4?i.replace(/\B(?=(\d{3})+(?!\d))/g,"\u202f"):i;return (x<0?"−":"")+g+(d?(LANG==="es"?",":".")+d:"");};
const R=(q,a,dp,u,steps,extra)=>Object.assign({q,a,dp,u,steps},extra||{});
const C=(q,choices,a,steps)=>({q,choices,a,steps});

const GYM=()=>[
 {id:"units",t:"A2.2",ic:"📏",n:L("Unit converter","Conversor de unidades"),
  f:L("1 mm = 1000 µm · 1 µm = 1000 nm. Going to a smaller unit → multiply by 1000; going to a bigger unit → divide by 1000.","1 mm = 1000 µm · 1 µm = 1000 nm. A una unidad más pequeña → multiplica por 1000; a una más grande → divide entre 1000."),
  g(){const k=ch(["mm-um","um-mm","um-nm","nm-um","mm-nm"]);
   if(k==="mm-um"){const v=ri(2,950)/100;return R([L(`Convert ${nf(v,2)} mm into µm.`,`Convierte ${nf(v,2)} mm a µm.`)],v*1000,0,"µm",[`${nf(v,2)} × 1000 = ${nf(v*1000,0)} µm`]);}
   if(k==="um-mm"){const v=ri(5,900);return R([L(`Convert ${v} µm into mm.`,`Convierte ${v} µm a mm.`)],v/1000,3,"mm",[`${v} ÷ 1000 = ${nf(v/1000,3)} mm`]);}
   if(k==="um-nm"){const v=ri(1,90)/10;return R([L(`Convert ${nf(v,1)} µm into nm.`,`Convierte ${nf(v,1)} µm a nm.`)],v*1000,0,"nm",[`${nf(v,1)} × 1000 = ${nf(v*1000,0)} nm`]);}
   if(k==="nm-um"){const v=ri(20,950);return R([L(`A virus is ${v} nm across. Convert this into µm.`,`Un virus mide ${v} nm. Conviértelo a µm.`)],v/1000,3,"µm",[`${v} ÷ 1000 = ${nf(v/1000,3)} µm`]);}
   const v=ri(1,9)/1000;return R([L(`Convert ${nf(v,3)} mm into nm.`,`Convierte ${nf(v,3)} mm a nm.`)],v*1e6,0,"nm",[L(`mm → µm: ${nf(v,3)} × 1000 = ${nf(v*1000,0)} µm`,`mm → µm: ${nf(v,3)} × 1000 = ${nf(v*1000,0)} µm`),L(`µm → nm: × 1000 = ${nfi(v*1e6)} nm`,`µm → nm: × 1000 = ${nfi(v*1e6)} nm`)]);}},
 {id:"mag",t:"A2.2",ic:"🔬",n:L("Magnification","Aumento"),
  f:L("Magnification = image size ÷ actual size (same units!). Rearranged: actual size = image size ÷ magnification.","Aumento = tamaño de la imagen ÷ tamaño real (¡mismas unidades!). Despejando: tamaño real = tamaño de la imagen ÷ aumento."),
  g(){const k=ri(0,2);
   if(k===0){const I=ri(15,95),M=ch([400,1000,2000,2500,5000,10000,20000,40000]);const um=I*1000/M;
    if(um<1)return R([L(`A structure measures ${I} mm in a micrograph with a magnification of ×${nfi(M)}. Calculate its actual size in nm.`,`Una estructura mide ${I} mm en una micrografía con un aumento de ×${nfi(M)}. Calcula su tamaño real en nm.`)],I*1e6/M,0,"nm",[L(`Image size in nm: ${I} mm = ${nfi(I*1e6)} nm`,`Tamaño de la imagen en nm: ${I} mm = ${nfi(I*1e6)} nm`),L(`Actual = image ÷ magnification = ${nfi(I*1e6)} ÷ ${nfi(M)} = ${nf(I*1e6/M,0)} nm`,`Real = imagen ÷ aumento = ${nfi(I*1e6)} ÷ ${nfi(M)} = ${nf(I*1e6/M,0)} nm`)]);
    return R([L(`A cell measures ${I} mm in a drawing with a magnification of ×${nfi(M)}. Calculate its actual size in µm.`,`Una célula mide ${I} mm en un dibujo con un aumento de ×${nfi(M)}. Calcula su tamaño real en µm.`)],um,1,"µm",[L(`Image size in µm: ${I} mm × 1000 = ${nfi(I*1000)} µm`,`Tamaño de la imagen en µm: ${I} mm × 1000 = ${nfi(I*1000)} µm`),L(`Actual = ${nfi(I*1000)} ÷ ${nfi(M)} = ${nf(um,1)} µm`,`Real = ${nfi(I*1000)} ÷ ${nfi(M)} = ${nf(um,1)} µm`)]);}
   const A=ri(2,60);const Ms=[100,200,400,500,1000,1500,2000,2500].filter(M=>A*M/1000>=10&&A*M/1000<=150);const M=Ms.length?ch(Ms):1000;const I=rd(A*M/1000,1);
   if(k===1)return R([L(`A cell that is actually ${A} µm long appears ${nf(I,1)} mm long in a photomicrograph. Calculate the magnification.`,`Una célula que mide realmente ${A} µm aparece con ${nf(I,1)} mm en una fotomicrografía. Calcula el aumento.`)],I*1000/A,0,"×",[L(`Same units: ${nf(I,1)} mm = ${nfi(I*1000)} µm`,`Mismas unidades: ${nf(I,1)} mm = ${nfi(I*1000)} µm`),L(`Magnification = ${nfi(I*1000)} ÷ ${A} = ×${nf(I*1000/A,0)}`,`Aumento = ${nfi(I*1000)} ÷ ${A} = ×${nf(I*1000/A,0)}`)]);
   return R([L(`A cell ${A} µm long is drawn at a magnification of ×${nfi(M)}. How long should the drawing be, in mm?`,`Una célula de ${A} µm se dibuja con un aumento de ×${nfi(M)}. ¿Cuánto debe medir el dibujo, en mm?`)],A*M/1000,1,"mm",[L(`Image = actual × magnification = ${A} × ${nfi(M)} = ${nfi(A*M)} µm`,`Imagen = real × aumento = ${A} × ${nfi(M)} = ${nfi(A*M)} µm`),`${nfi(A*M)} µm ÷ 1000 = ${nf(A*M/1000,1)} mm`]);}},
 {id:"scale",t:"A2.2",ic:"📐",n:L("Scale bars","Barras de escala"),
  f:L("Measure the scale bar with a ruler. Actual size = (object length ÷ scale bar length) × value of the scale bar. Magnification = scale bar length ÷ value it represents (same units).","Mide la barra de escala con una regla. Tamaño real = (longitud del objeto ÷ longitud de la barra) × valor de la barra. Aumento = longitud de la barra ÷ valor que representa (mismas unidades)."),
  g(){const b=ri(10,40),s=ch([1,2,5,10,20,50,100]);
   if(Math.random()<0.6){const I=ri(15,120);const a=I/b*s;return R([L(`On a micrograph, a scale bar ${b} mm long represents ${s} µm. A mitochondrion measures ${I} mm. Calculate its actual length in µm.`,`En una micrografía, una barra de escala de ${b} mm representa ${s} µm. Una mitocondria mide ${I} mm. Calcula su longitud real en µm.`)],a,1,"µm",[`${I} ÷ ${b} = ${nf(I/b,2)} ${L("scale-bar lengths","barras de escala")}`,`${nf(I/b,2)} × ${s} µm = ${nf(a,1)} µm`]);}
   const M=b*1000/s;return R([L(`A scale bar ${b} mm long is labelled ${s} µm. Calculate the magnification of the image.`,`Una barra de escala de ${b} mm tiene la etiqueta ${s} µm. Calcula el aumento de la imagen.`)],M,0,"×",[`${b} mm = ${nfi(b*1000)} µm`,`${nfi(b*1000)} ÷ ${s} = ×${nf(M,0)}`]);}},
 {id:"sav",t:"B2.3",ic:"🧊",n:L("Surface area : volume","Superficie : volumen"),
  f:L("Cube of side x: SA = 6x², V = x³, SA:V = 6/x. Cuboid: SA = 2(lw + lh + wh), V = lwh. Bigger cells → smaller SA:V.","Cubo de lado x: S = 6x², V = x³, S:V = 6/x. Prisma: S = 2(lw + lh + wh), V = lwh. Células más grandes → menor S:V."),
  g(){if(Math.random()<0.5){const x=ri(1,8);const k=ch(["sa","r"]);if(k==="sa")return R([L(`A cube-shaped cell model has sides of ${x} cm. Calculate its surface area.`,`Un modelo de célula cúbico tiene lados de ${x} cm. Calcula su superficie.`)],6*x*x,0,"cm²",[`SA = 6 × ${x}² = 6 × ${x*x} = ${6*x*x} cm²`]);
     return R([L(`Calculate the surface area to volume ratio of a cube with ${x} cm sides. Give the answer as x : 1.`,`Calcula la relación superficie/volumen de un cubo de ${x} cm de lado. Da la respuesta como x : 1.`)],6/x,2,": 1",[`SA = 6 × ${x}² = ${6*x*x} cm²`,`V = ${x}³ = ${x*x*x} cm³`,`${6*x*x} ÷ ${x*x*x} = ${nf(6/x,2)} : 1`]);}
   const l=ri(2,10),w=ri(1,5),h=ri(1,4);const sa=2*(l*w+l*h+w*h),v=l*w*h;return R([L(`An agar block is ${l} mm × ${w} mm × ${h} mm. Calculate its SA:V ratio (x : 1).`,`Un bloque de agar mide ${l} mm × ${w} mm × ${h} mm. Calcula su relación S:V (x : 1).`)],sa/v,2,": 1",[`SA = 2(${l}×${w} + ${l}×${h} + ${w}×${h}) = ${sa} mm²`,`V = ${l}×${w}×${h} = ${v} mm³`,`${sa} ÷ ${v} = ${nf(sa/v,2)} : 1`]);}},
 {id:"pct",t:"Tools",ic:"％",n:L("Percentages","Porcentajes"),
  f:L("% change = (new − original) ÷ original × 100. A negative answer is a decrease. Percentage of a total = part ÷ total × 100.","% de cambio = (final − inicial) ÷ inicial × 100. Un resultado negativo es una disminución. Porcentaje de un total = parte ÷ total × 100."),
  g(){const k=ri(0,2);
   if(k<2){const o=ri(20,400);const n=Math.max(1,Math.round(o*(1+ch([-0.6,-0.45,-0.3,-0.15,0.2,0.35,0.5,0.8,1.2,1.5])+ri(-5,5)/100)));const p=(n-o)/o*100;
    const ctx=ch([[L("The mass of a potato cylinder","La masa de un cilindro de papa"),"g"],[L("The population of a lizard species","La población de una especie de lagarto"),""],[L("Mean heart rate","La frecuencia cardíaca media"),L("bpm","lpm")]]);
    const o2=ctx[1]==="g"?o/10:o,n2=ctx[1]==="g"?n/10:n,dp0=ctx[1]==="g"?1:0;
    return R([L(`${ctx[0]} changed from ${nf(o2,dp0)} to ${nf(n2,dp0)} ${ctx[1]}. Calculate the percentage change (use a minus sign for a decrease).`,`${ctx[0]} cambió de ${nf(o2,dp0)} a ${nf(n2,dp0)} ${ctx[1]}. Calcula el porcentaje de cambio (usa el signo menos si es una disminución).`)],p,1,"%",[`(${nf(n2,dp0)} − ${nf(o2,dp0)}) ÷ ${nf(o2,dp0)} × 100`,`= ${nf(p,1)} %`]);}
   const tot=ri(40,300),part=ri(3,tot-3);return R([L(`In a field of view, ${part} of ${tot} cells were stained blue. What percentage of cells were stained?`,`En un campo de visión, ${part} de ${tot} células se tiñeron de azul. ¿Qué porcentaje de células se tiñó?`)],part/tot*100,1,"%",[`${part} ÷ ${tot} × 100 = ${nf(part/tot*100,1)} %`]);}},
 {id:"stats",t:"Tools",ic:"📊",n:L("Mean, median & range","Media, mediana y rango"),
  f:L("Mean = sum ÷ number of values. Median = middle value when ordered (mean of the two middle values if the count is even). Range = largest − smallest.","Media = suma ÷ número de valores. Mediana = valor central al ordenarlos (media de los dos centrales si hay un número par). Rango = mayor − menor."),
  g(){const n=ch([5,6,7]);const d=Array.from({length:n},()=>ri(12,58));const s=[...d].sort((a,b)=>a-b);const k=ch(["mean","median","range"]);
   const q=[L(`Stomata counted in ${n} fields of view: ${d.join(", ")}.`,`Estomas contados en ${n} campos de visión: ${d.join("; ")}.`)];
   if(k==="mean"){const sum=d.reduce((a,b)=>a+b,0);q.push(L("Calculate the mean.","Calcula la media."));return R(q,sum/n,1,"",[L(`Sum = ${sum}`,`Suma = ${sum}`),`${sum} ÷ ${n} = ${nf(sum/n,1)}`]);}
   if(k==="range"){q.push(L("Calculate the range.","Calcula el rango."));return R(q,s[n-1]-s[0],0,"",[`${s[n-1]} − ${s[0]} = ${s[n-1]-s[0]}`]);}
   const med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;q.push(L("Find the median.","Halla la mediana."));return R(q,med,1,"",[L(`Ordered: ${s.join(", ")}`,`Ordenados: ${s.join("; ")}`),n%2?L(`Middle value = ${med}`,`Valor central = ${med}`):L(`(${s[n/2-1]} + ${s[n/2]}) ÷ 2 = ${nf(med,1)}`,`(${s[n/2-1]} + ${s[n/2]}) ÷ 2 = ${nf(med,1)}`)]);}},
 {id:"rate",t:"C1.1",ic:"⏱️",n:L("Rates","Velocidades"),
  f:L("Rate = change ÷ time taken. Units are 'quantity per time', e.g. cm³ s⁻¹. If you measure the time for a change to happen, rate = 1 ÷ time.","Velocidad = cambio ÷ tiempo. Las unidades son 'cantidad por tiempo', p. ej. cm³ s⁻¹. Si mides el tiempo que tarda un cambio, velocidad = 1 ÷ tiempo."),
  g(){const k=ri(0,3);
   if(k===0){const v=ri(6,60),t=ch([30,60,90,120,180]);return R([L(`Catalase in liver tissue released ${v} cm³ of oxygen in ${t} s. Calculate the mean rate of reaction in cm³ s⁻¹.`,`La catalasa del hígado liberó ${v} cm³ de oxígeno en ${t} s. Calcula la velocidad media de reacción en cm³ s⁻¹.`)],v/t,2,"cm³ s⁻¹",[`${v} ÷ ${t} = ${nf(v/t,2)} cm³ s⁻¹`]);}
   if(k===1){const b=ri(25,140),t=ch([2,4,5]);return R([L(`A pondweed released ${b} bubbles in ${t} minutes. Calculate the rate in bubbles per minute.`,`Una planta acuática liberó ${b} burbujas en ${t} minutos. Calcula la velocidad en burbujas por minuto.`)],b/t,1,L("bubbles min⁻¹","burbujas min⁻¹"),[`${b} ÷ ${t} = ${nf(b/t,1)}`]);}
   if(k===2){const d=ri(12,90),t=ch([5,10,15,20]);return R([L(`In a respirometer with germinating seeds, the coloured drop moved ${d} mm in ${t} minutes. Calculate the rate of oxygen uptake in mm min⁻¹.`,`En un respirómetro con semillas en germinación, la gota de color se movió ${d} mm en ${t} minutos. Calcula la velocidad de consumo de oxígeno en mm min⁻¹.`)],d/t,2,"mm min⁻¹",[`${d} ÷ ${t} = ${nf(d/t,2)} mm min⁻¹`]);}
   const t=ri(20,240);return R([L(`Starch disappeared (iodine test) after ${t} s. Calculate the rate of reaction as 1/time, in s⁻¹ (3 decimal places).`,`El almidón desapareció (prueba del yodo) a los ${t} s. Calcula la velocidad como 1/tiempo, en s⁻¹ (3 decimales).`)],1/t,3,"s⁻¹",[`1 ÷ ${t} = ${nf(1/t,3)} s⁻¹`]);}},
 {id:"rf",t:"C1.3",ic:"🌈",n:L("Rf values","Valores de Rf"),
  f:L("Rf = distance moved by the pigment ÷ distance moved by the solvent front. Measure both from the start line. Rf is always between 0 and 1.","Rf = distancia recorrida por el pigmento ÷ distancia recorrida por el frente del disolvente. Mide ambas desde la línea de partida. Rf siempre está entre 0 y 1."),
  g(){const fr=ri(60,120);const rf=ch([0.95,0.83,0.71,0.65,0.45,0.32]);const sp=Math.round(fr*rf);
   if(Math.random()<0.7)return R([L(`The solvent front moved ${fr} mm and a pigment spot moved ${sp} mm. Calculate the Rf value (2 decimal places).`,`El frente del disolvente avanzó ${fr} mm y una mancha de pigmento avanzó ${sp} mm. Calcula el valor de Rf (2 decimales).`)],sp/fr,2,"",[`${sp} ÷ ${fr} = ${nf(sp/fr,2)}`]);
   return R([L(`Chlorophyll b has an Rf of ${nf(rf,2)}. If the solvent front moved ${fr} mm, how far should chlorophyll b have moved (mm)?`,`La clorofila b tiene un Rf de ${nf(rf,2)}. Si el frente del disolvente avanzó ${fr} mm, ¿cuánto debió avanzar la clorofila b (mm)?`)],rf*fr,0,"mm",[L(`distance = Rf × solvent front = ${nf(rf,2)} × ${fr}`,`distancia = Rf × frente = ${nf(rf,2)} × ${fr}`),`= ${nf(rf*fr,0)} mm`]);}},
 {id:"lung",t:"B3.1",ic:"🫁",n:L("Lung volumes","Volúmenes pulmonares"),
  f:L("Tidal volume = air in or out in a normal breath. Vital capacity = max inhalation − max exhalation. Ventilation rate = breaths per minute. Minute volume = tidal volume × ventilation rate.","Volumen corriente = aire que entra o sale en una respiración normal. Capacidad vital = inspiración máxima − espiración máxima. Frecuencia respiratoria = respiraciones por minuto. Volumen minuto = volumen corriente × frecuencia."),
  g(){const e=ri(22,28)/10,tv=ri(4,7)/10,mi=ri(50,62)/10,me=ri(10,15)/10;
   const tab=[`| ${L("Spirometer reading","Lectura del espirómetro")} | ${L("Lung volume / dm³","Volumen pulmonar / dm³")} |`,`| ${L("End of normal exhalation","Final de una espiración normal")} | ${nf(e,1)} |`,`| ${L("End of normal inhalation","Final de una inspiración normal")} | ${nf(e+tv,1)} |`,`| ${L("Maximum inhalation","Inspiración máxima")} | ${nf(mi,1)} |`,`| ${L("Maximum exhalation","Espiración máxima")} | ${nf(me,1)} |`];
   const k=ri(0,3);
   if(k===0)return R([...tab,L("Calculate the tidal volume.","Calcula el volumen corriente.")],tv,1,"dm³",[`${nf(e+tv,1)} − ${nf(e,1)} = ${nf(tv,1)} dm³`]);
   if(k===1)return R([...tab,L("Calculate the vital capacity.","Calcula la capacidad vital.")],mi-me,1,"dm³",[`${nf(mi,1)} − ${nf(me,1)} = ${nf(mi-me,1)} dm³`]);
   if(k===2){const b=ri(12,18);const tv2=ri(4,6)/10;return R([L(`A student breathes ${b} times per minute with a tidal volume of ${nf(tv2,1)} dm³. Calculate the volume of air ventilated per minute.`,`Un estudiante respira ${b} veces por minuto con un volumen corriente de ${nf(tv2,1)} dm³. Calcula el volumen de aire ventilado por minuto.`)],b*tv2,1,"dm³ min⁻¹",[`${nf(tv2,1)} × ${b} = ${nf(b*tv2,1)} dm³ min⁻¹`]);}
   const n=ri(4,9),s=ch([15,20,30]);return R([L(`A student counted ${n} breaths in ${s} s. Calculate the ventilation rate in breaths per minute.`,`Un estudiante contó ${n} respiraciones en ${s} s. Calcula la frecuencia respiratoria en respiraciones por minuto.`)],n*60/s,0,L("breaths min⁻¹","resp. min⁻¹"),[`${n} × (60 ÷ ${s}) = ${nf(n*60/s,0)}`]);}},
 {id:"pulse",t:"B3.2",ic:"💓",n:L("Pulse rate","Pulso"),
  f:L("Heart rate (beats per minute) = beats counted × (60 ÷ seconds counted). From a trace: heart rate = 60 ÷ time for one beat (s).","Frecuencia cardíaca (latidos por minuto) = latidos contados × (60 ÷ segundos contados). En un trazado: frecuencia = 60 ÷ tiempo de un latido (s)."),
  g(){const k=ri(0,2);
   if(k===0){const s=ch([10,15,20,30]);const b=Math.round(ri(55,140)*s/60);return R([L(`A pulse was counted at the wrist: ${b} beats in ${s} seconds. Calculate the heart rate.`,`Se contó el pulso en la muñeca: ${b} latidos en ${s} segundos. Calcula la frecuencia cardíaca.`)],b*60/s,0,L("bpm","lpm"),[`${b} × (60 ÷ ${s}) = ${nf(b*60/s,0)}`]);}
   if(k===1){const t=ch([0.5,0.6,0.75,0.8,1.0,1.2]);return R([L(`On an ECG trace, one complete heartbeat takes ${nf(t,2)} s. Calculate the heart rate.`,`En un electrocardiograma, un latido completo dura ${nf(t,2)} s. Calcula la frecuencia cardíaca.`)],60/t,0,L("bpm","lpm"),[`60 ÷ ${nf(t,2)} = ${nf(60/t,0)}`]);}
   const r=ri(60,80),x=ri(110,170);return R([L(`Resting heart rate was ${r} bpm and rose to ${x} bpm after exercise. Calculate the percentage increase.`,`La frecuencia en reposo era ${r} lpm y subió a ${x} lpm tras el ejercicio. Calcula el porcentaje de aumento.`)],(x-r)/r*100,1,"%",[`(${x} − ${r}) ÷ ${r} × 100 = ${nf((x-r)/r*100,1)} %`]);}},
 {id:"stomata",t:"B3.1",ic:"🍃",n:L("Stomatal density","Densidad estomática"),
  f:L("Area of a circular field of view = πr² (r = diameter ÷ 2). Stomatal density = number of stomata ÷ area (stomata mm⁻²).","Área de un campo de visión circular = πr² (r = diámetro ÷ 2). Densidad estomática = número de estomas ÷ área (estomas mm⁻²)."),
  g(){const d=ch([0.4,0.5,0.6,0.8,1.0]),n=ri(8,45);const A=Math.PI*(d/2)**2;
   if(Math.random()<0.35)return R([L(`The field of view of a microscope has a diameter of ${nf(d,1)} mm. Calculate its area in mm² (3 decimal places).`,`El campo de visión de un microscopio tiene ${nf(d,1)} mm de diámetro. Calcula su área en mm² (3 decimales).`)],A,3,"mm²",[`r = ${nf(d/2,2)} mm`,`π × ${nf(d/2,2)}² = ${nf(A,3)} mm²`]);
   return R([L(`${n} stomata were counted in a field of view with a diameter of ${nf(d,1)} mm. Calculate the stomatal density.`,`Se contaron ${n} estomas en un campo de visión de ${nf(d,1)} mm de diámetro. Calcula la densidad estomática.`)],n/A,0,L("stomata mm⁻²","estomas mm⁻²"),[`${L("Area","Área")} = π × ${nf(d/2,2)}² = ${nf(A,3)} mm²`,`${n} ÷ ${nf(A,3)} = ${nf(n/A,0)}`]);}},
 {id:"lincoln",t:"C4.1",ic:"🐌",n:L("Lincoln index","Índice de Lincoln"),
  f:L("Population size = (M × N) ÷ R, where M = number first marked, N = total in the second sample, R = marked individuals recaptured.","Tamaño de la población = (M × N) ÷ R, donde M = marcados la primera vez, N = total de la segunda muestra, R = marcados recapturados."),
  g(){const R0=ri(3,15),M=ri(20,120),N=ri(Math.max(R0+5,15),100);const est=M*N/R0;const sp=ch([L("woodlice","cochinillas"),L("snails","caracoles"),L("ground beetles","escarabajos"),L("crabs","cangrejos")]);
   return R([L(`${M} ${sp} were captured, marked and released. A week later ${N} were captured, of which ${R0} were marked. Estimate the population size.`,`Se capturaron, marcaron y liberaron ${M} ${sp}. Una semana después se capturaron ${N}, de los cuales ${R0} estaban marcados. Estima el tamaño de la población.`)],est,0,"",[`(${M} × ${N}) ÷ ${R0}`,`= ${nfi(M*N)} ÷ ${R0} = ${nf(est,0)}`]);}},
 {id:"quadrat",t:"C4.1",ic:"🟩",n:L("Quadrat sampling","Muestreo con cuadrantes"),
  f:L("Mean per quadrat = total counted ÷ number of quadrats. Population = mean per quadrat × (total area ÷ area of one quadrat). Density = mean ÷ quadrat area.","Media por cuadrante = total contado ÷ número de cuadrantes. Población = media × (área total ÷ área de un cuadrante). Densidad = media ÷ área del cuadrante."),
  g(){const qa=ch([0.25,0.5,1]);const cs=Array.from({length:ri(5,8)},()=>ri(0,14));const sum=cs.reduce((a,b)=>a+b,0)||5;const mean=sum/cs.length;const area=ch([50,100,200,250,400]);
   if(Math.random()<0.4)return R([L(`Dandelions in ${cs.length} random ${nf(qa,2)} m² quadrats: ${cs.join(", ")}. Calculate the population density (plants m⁻², 1 decimal place).`,`Dientes de león en ${cs.length} cuadrantes aleatorios de ${nf(qa,2)} m²: ${cs.join("; ")}. Calcula la densidad de población (plantas m⁻², 1 decimal).`)],mean/qa,1,L("plants m⁻²","plantas m⁻²"),[L(`Mean = ${sum} ÷ ${cs.length} = ${nf(mean,2)} per quadrat`,`Media = ${sum} ÷ ${cs.length} = ${nf(mean,2)} por cuadrante`),`${nf(mean,2)} ÷ ${nf(qa,2)} = ${nf(mean/qa,1)}`]);
   return R([L(`Dandelions in ${cs.length} random ${nf(qa,2)} m² quadrats: ${cs.join(", ")}. The field is ${area} m². Estimate the total population.`,`Dientes de león en ${cs.length} cuadrantes aleatorios de ${nf(qa,2)} m²: ${cs.join("; ")}. El campo mide ${area} m². Estima la población total.`)],mean*area/qa,0,"",[L(`Mean = ${sum} ÷ ${cs.length} = ${nf(mean,2)} per quadrat`,`Media = ${sum} ÷ ${cs.length} = ${nf(mean,2)} por cuadrante`),L(`Number of quadrats that fit = ${area} ÷ ${nf(qa,2)} = ${nf(area/qa,0)}`,`Cuadrantes que caben = ${area} ÷ ${nf(qa,2)} = ${nf(area/qa,0)}`),`${nf(mean,2)} × ${nf(area/qa,0)} = ${nf(mean*area/qa,0)}`]);}},
 {id:"chi1",t:"C4.1",ic:"🔗",n:L("χ² test for association","Prueba χ² de asociación"),
  f:L("Expected = (row total × column total) ÷ grand total. χ² = Σ (O − E)² ÷ E. For a 2 × 2 table, df = 1 and the critical value (p = 0.05) is 3.84. χ² > 3.84 → significant association.","Esperado = (total de fila × total de columna) ÷ total general. χ² = Σ (O − E)² ÷ E. En una tabla 2 × 2, gl = 1 y el valor crítico (p = 0,05) es 3,84. χ² > 3,84 → asociación significativa."),
  g(){let a,b,c,d;do{a=ri(5,30);b=ri(3,25);c=ri(3,25);d=ri(5,35);}while(a+b+c+d<40);const T=a+b+c+d,r1=a+b,r2=c+d,c1=a+c,c2=b+d;const E=[r1*c1/T,r1*c2/T,r2*c1/T,r2*c2/T],O=[a,b,c,d];const chi=O.reduce((s,o,i)=>s+(o-E[i])**2/E[i],0);
   const tab=[`| | ${L("Species B present","Especie B presente")} | ${L("Species B absent","Especie B ausente")} | ${L("Total","Total")} |`,`| ${L("Species A present","Especie A presente")} | ${a} | ${b} | ${r1} |`,`| ${L("Species A absent","Especie A ausente")} | ${c} | ${d} | ${r2} |`,`| ${L("Total","Total")} | ${c1} | ${c2} | ${T} |`];
   const intro=L(`Quadrats were checked for two plant species.`,`Se revisaron cuadrantes en busca de dos especies de plantas.`);
   const k=ri(0,2);
   if(k===0)return R([intro,...tab,L("Calculate the expected number of quadrats with both species present (1 decimal place).","Calcula el número esperado de cuadrantes con ambas especies presentes (1 decimal).")],E[0],1,"",[`(${r1} × ${c1}) ÷ ${T} = ${nf(E[0],1)}`]);
   if(k===1)return R([intro,...tab,L("Calculate χ² (2 decimal places).","Calcula χ² (2 decimales).")],chi,2,"",[L(`Expected: ${E.map(e=>nf(e,2)).join(", ")}`,`Esperados: ${E.map(e=>nf(e,2)).join("; ")}`),O.map((o,i)=>`(${o} − ${nf(E[i],2)})²/${nf(E[i],2)}`).join(" + "),`χ² = ${nf(chi,2)}`],{tol:0.03});
   return C([intro,...tab,L(`χ² for this table is ${nf(chi,2)} (df = 1, critical value 3.84). What can you conclude?`,`χ² para esta tabla es ${nf(chi,2)} (gl = 1, valor crítico 3,84). ¿Qué puedes concluir?`)],[L("Significant association: reject the null hypothesis","Asociación significativa: se rechaza la hipótesis nula"),L("No significant association: accept the null hypothesis","No hay asociación significativa: se acepta la hipótesis nula")],chi>3.84?0:1,[chi>3.84?L(`${nf(chi,2)} > 3.84, so the difference from random distribution is significant (p < 0.05).`,`${nf(chi,2)} > 3,84, así que la diferencia respecto a una distribución al azar es significativa (p < 0,05).`):L(`${nf(chi,2)} < 3.84, so the difference could be due to chance (p > 0.05).`,`${nf(chi,2)} < 3,84, así que la diferencia podría deberse al azar (p > 0,05).`)]);}},
 {id:"energy",t:"C4.2",ic:"⚡",n:L("Energy transfer","Transferencia de energía"),
  f:L("Efficiency (%) = energy at the higher trophic level ÷ energy at the lower level × 100. Net primary production = gross primary production − energy lost in plant respiration.","Eficiencia (%) = energía en el nivel trófico superior ÷ energía en el nivel inferior × 100. Producción primaria neta = producción primaria bruta − energía perdida en la respiración de la planta."),
  g(){const k=ri(0,2);
   if(k===0){const p=ri(8,40)*1000,e=ri(5,18)/100;const c=Math.round(p*e/10)*10;return R([L(`Producers in a grassland store ${nfi(p)} kJ m⁻² y⁻¹. Primary consumers store ${nfi(c)} kJ m⁻² y⁻¹. Calculate the efficiency of energy transfer.`,`Los productores de una pradera almacenan ${nfi(p)} kJ m⁻² año⁻¹. Los consumidores primarios almacenan ${nfi(c)} kJ m⁻² año⁻¹. Calcula la eficiencia de la transferencia de energía.`)],c/p*100,1,"%",[`${nfi(c)} ÷ ${nfi(p)} × 100 = ${nf(c/p*100,1)} %`]);}
   if(k===1){const p=ch([10000,20000,50000,80000]);const lv=ch([2,3]);return R([L(`Producers fix ${nfi(p)} kJ m⁻² y⁻¹. Assuming 10 % efficiency at each transfer, how much energy reaches the ${lv===2?"secondary":"tertiary"} consumers?`,`Los productores fijan ${nfi(p)} kJ m⁻² año⁻¹. Suponiendo un 10 % de eficiencia en cada transferencia, ¿cuánta energía llega a los consumidores ${lv===2?"secundarios":"terciarios"}?`)],p/10**lv,0,"kJ m⁻² y⁻¹",[Array.from({length:lv},(_,i)=>nfi(p/10**i)+" × "+nf(0.1,1)).join(" → ")+` = ${nfi(p/10**lv)}`]);}
   const g=ri(15,40)*1000,r=Math.round(g*ri(35,65)/100/100)*100;return R([L(`Gross primary production of a forest is ${nfi(g)} kJ m⁻² y⁻¹ and plant respiration uses ${nfi(r)} kJ m⁻² y⁻¹. Calculate the net primary production.`,`La producción primaria bruta de un bosque es ${nfi(g)} kJ m⁻² año⁻¹ y la respiración vegetal usa ${nfi(r)} kJ m⁻² año⁻¹. Calcula la producción primaria neta.`)],g-r,0,"kJ m⁻² y⁻¹",[`NPP = GPP − R = ${nfi(g)} − ${nfi(r)} = ${nfi(g-r)}`]);}},
 {id:"growth",t:"C4.1",ic:"🦠",n:L("Population growth","Crecimiento poblacional"),
  f:L("Bacteria divide by binary fission. Number of generations n = time ÷ generation time. Final number = initial number × 2ⁿ.","Las bacterias se dividen por fisión binaria. Número de generaciones n = tiempo ÷ tiempo de generación. Número final = número inicial × 2ⁿ."),
  g(){const g=ch([20,30,40,60]),n=ri(2,8),N0=ch([1,5,10,50,100,200]);const t=g*n;
   if(Math.random()<0.4)return R([L(`A bacterium divides every ${g} minutes. How many generations are produced in ${t} minutes?`,`Una bacteria se divide cada ${g} minutos. ¿Cuántas generaciones se producen en ${t} minutos?`)],n,0,"",[`${t} ÷ ${g} = ${n}`]);
   return R([L(`A culture starts with ${N0} bacteria that divide every ${g} minutes. How many bacteria are there after ${t} minutes (assuming no deaths)?`,`Un cultivo empieza con ${N0} bacterias que se dividen cada ${g} minutos. ¿Cuántas bacterias hay a los ${t} minutos (sin muertes)?`)],N0*2**n,0,"",[`n = ${t} ÷ ${g} = ${n}`,`${N0} × 2^${n} = ${N0} × ${2**n} = ${nfi(N0*2**n)}`]);}},
 {id:"mitotic",t:"D2.1",ic:"🧬",n:L("Mitotic index","Índice mitótico"),
  f:L("Mitotic index = number of cells in mitosis (prophase + metaphase + anaphase + telophase) ÷ total number of cells. Interphase cells are not in mitosis.","Índice mitótico = número de células en mitosis (profase + metafase + anafase + telofase) ÷ número total de células. Las células en interfase no están en mitosis."),
  g(){const p=ri(3,12),m=ri(1,6),a=ri(1,4),t=ri(1,5),i=ri(40,120);const mi=p+m+a+t,T=mi+i;
   return R([`| ${L("Phase","Fase")} | ${L("Interphase","Interfase")} | ${L("Prophase","Profase")} | ${L("Metaphase","Metafase")} | ${L("Anaphase","Anafase")} | ${L("Telophase","Telofase")} |`,`| ${L("Cells","Células")} | ${i} | ${p} | ${m} | ${a} | ${t} |`,L("Calculate the mitotic index of this root tip (2 decimal places).","Calcula el índice mitótico de este ápice de raíz (2 decimales).")],mi/T,2,"",[L(`Cells in mitosis = ${p} + ${m} + ${a} + ${t} = ${mi}`,`Células en mitosis = ${p} + ${m} + ${a} + ${t} = ${mi}`),L(`Total = ${mi} + ${i} = ${T}`,`Total = ${mi} + ${i} = ${T}`),`${mi} ÷ ${T} = ${nf(mi/T,2)}`]);}},
 {id:"cross",t:"D3.2",ic:"🧪",n:L("Monohybrid crosses","Cruces monohíbridos"),
  f:L("Draw a Punnett grid. Each box = 1/4 = 25 %. Expected number = probability × number of offspring. X-linked: write alleles on the X (Xᴬ, Xᵃ); Y carries no allele.","Dibuja un cuadro de Punnett. Cada casilla = 1/4 = 25 %. Número esperado = probabilidad × número de descendientes. Ligado al X: escribe los alelos sobre el X (Xᴬ, Xᵃ); el Y no lleva alelo."),
  g(){const k=ri(0,4);
   if(k===0)return R([L("Two carriers of cystic fibrosis (Ff × Ff) have a child. What is the probability (%) that the child has cystic fibrosis (ff)?","Dos portadores de fibrosis quística (Ff × Ff) tienen un hijo. ¿Cuál es la probabilidad (%) de que tenga fibrosis quística (ff)?")],25,0,"%",["FF, Ff, Ff, ff → 1/4 = 25 %"]);
   if(k===1){const N=ch([40,80,120,200,240]);return R([L(`Heterozygous tall pea plants (Tt) are crossed with each other and produce ${N} seeds. How many are expected to grow into short plants (tt)?`,`Se cruzan entre sí plantas de guisante altas heterocigotas (Tt) y producen ${N} semillas. ¿Cuántas se espera que den plantas enanas (tt)?`)],N/4,0,"",[`Tt × Tt → 1 TT : 2 Tt : 1 tt`,`${N} × 1/4 = ${N/4}`]);}
   if(k===2)return R([L("A heterozygous plant (Aa) is crossed with a homozygous recessive plant (aa). What percentage of offspring show the recessive phenotype?","Una planta heterocigota (Aa) se cruza con una homocigota recesiva (aa). ¿Qué porcentaje de la descendencia muestra el fenotipo recesivo?")],50,0,"%",["Aa × aa → Aa, Aa, aa, aa","2/4 = 50 %"]);
   if(k===3)return R([L("A woman who carries red–green colour blindness (XᴮXᵇ) has a son with a man with normal vision (XᴮY). What is the probability (%) that the son is colour blind?","Una mujer portadora de daltonismo (XᴮXᵇ) tiene un hijo varón con un hombre de visión normal (XᴮY). ¿Cuál es la probabilidad (%) de que el hijo sea daltónico?")],50,0,"%",[L("Sons get Y from the father and one X from the mother: XᴮY or XᵇY","Los hijos reciben el Y del padre y un X de la madre: XᴮY o XᵇY"),"1/2 = 50 %"]);
   return R([L("Parents with blood groups Iᴬi and Iᴮi have a child. What is the probability (%) that the child is blood group AB?","Unos padres con grupos sanguíneos Iᴬi e Iᴮi tienen un hijo. ¿Cuál es la probabilidad (%) de que sea del grupo AB?")],25,0,"%",["IᴬIᴮ, Iᴬi, Iᴮi, ii","IᴬIᴮ = 1/4 = 25 %"]);}},
 {id:"dilute",t:"Tools",ic:"🧫",n:L("Dilutions","Diluciones"),
  f:L("Serial dilution: each 1 in 10 step divides the concentration by 10. Simple dilution: C₁V₁ = C₂V₂ (C = concentration, V = volume).","Dilución seriada: cada paso 1 en 10 divide la concentración entre 10. Dilución simple: C₁V₁ = C₂V₂ (C = concentración, V = volumen)."),
  g(){if(Math.random()<0.5){const c=ch([1,2,0.5]),s=ri(1,4);return R([L(`A ${nf(c,1)} mol dm⁻³ sucrose solution is serially diluted 1 in 10, ${s} times. What is the final concentration (mol dm⁻³)?`,`Una solución de sacarosa de ${nf(c,1)} mol dm⁻³ se diluye en serie 1 en 10, ${s} veces. ¿Cuál es la concentración final (mol dm⁻³)?`)],c/10**s,s+1,"mol dm⁻³",[`${nf(c,1)} ÷ 10^${s} = ${nf(c/10**s,s+1)}`]);}
   const c1=ch([1,2]),c2=ch([0.1,0.2,0.25,0.4,0.5]),v2=ch([20,50,100]);return R([L(`You need ${v2} cm³ of ${nf(c2,2)} mol dm⁻³ glucose solution from a ${c1} mol dm⁻³ stock. What volume of stock (cm³) do you need?`,`Necesitas ${v2} cm³ de solución de glucosa de ${nf(c2,2)} mol dm⁻³ a partir de una solución madre de ${c1} mol dm⁻³. ¿Qué volumen de solución madre (cm³) necesitas?`)],c2*v2/c1,1,"cm³",[`V₁ = C₂V₂ ÷ C₁ = ${nf(c2,2)} × ${v2} ÷ ${c1}`,`= ${nf(c2*v2/c1,1)} cm³ (${L("make up to","completa hasta")} ${v2} cm³ ${L("with water","con agua")})`]);}},
 {id:"wp",t:"D2.3",hl:1,ic:"💧",n:L("Water potential","Potencial hídrico"),
  f:L("ψ = ψs + ψp. Solute potential ψs is zero or negative; pressure potential ψp is positive in turgid cells. Water moves from higher (less negative) to lower (more negative) ψ.","ψ = ψs + ψp. El potencial de soluto ψs es cero o negativo; el potencial de presión ψp es positivo en células turgentes. El agua va del ψ mayor (menos negativo) al menor (más negativo)."),
  g(){const k=ri(0,2);const s=-ri(4,15)*100,p=ri(1,8)*100;
   if(k===0)return R([L(`A plant cell has a solute potential of ${s} kPa and a pressure potential of ${p} kPa. Calculate its water potential.`,`Una célula vegetal tiene un potencial de soluto de ${s} kPa y un potencial de presión de ${p} kPa. Calcula su potencial hídrico.`)],s+p,0,"kPa",[`ψ = (${s}) + ${p} = ${s+p} kPa`]);
   if(k===1){const w=s+p;return R([L(`A cell has a water potential of ${w} kPa and a solute potential of ${s} kPa. Calculate its pressure potential.`,`Una célula tiene un potencial hídrico de ${w} kPa y un potencial de soluto de ${s} kPa. Calcula su potencial de presión.`)],p,0,"kPa",[`ψp = ψ − ψs = (${w}) − (${s}) = ${p} kPa`]);}
   const s2=-ri(4,15)*100,p2=ri(1,8)*100;const w1=s+p,w2=s2+p2;if(w1===w2)return GYM().find(x=>x.id==="wp").g();

 {id:"hw",t:"D4.1",hl:1,ic:"⚖️",n:L("Hardy–Weinberg","Hardy-Weinberg"),

 {id:"dihy",t:"D3.2",hl:1,ic:"🌽",n:L("Dihybrid crosses","Cruces dihíbridos"),

 {id:"chi2",t:"D3.2",hl:1,ic:"🎲",n:L("χ² test: dihybrid","Prueba χ²: dihíbrido"),

const heroUnlocked=h=>false;
function pwState(){const k=todayKey();if(!S.pw||S.pw.d!==k)S.pw={d:k,u:{}};return S.pw;}
const pwLeft=id=>{const h=HEROES().find(x=>x.id===id);return Math.max(0,h.max-(pwState().u[id]||0));};
function checkHeroes(){if(checkHeroes.busy)return;checkHeroes.busy=true;try{S.hs=S.hs||["mito"];const nu=HEROES().filter(h=>heroUnlocked(h)&&!S.hs.includes(h.id));if(nu.length){nu.forEach(h=>S.hs.push(h.id));save();const h=nu[0];setTimeout(()=>{toast("🦸 "+L("New hero unlocked: ","Nuevo héroe desbloqueado: ")+h.n+" · "+h.pn);confetti();sound("lvl");},400);}}finally{checkHeroes.busy=false;}}
const xpMult=R=>R&&R.mult&&R.mult.n>0?R.mult.k:1;
function powerBar(ctx){const R=ctx==="boss"?BS:MS;const hs=HEROES().filter(heroUnlocked);if(!hs.length||!R)return "";
  return `<div class="pwbar" role="toolbar" aria-label="${L("Hero powers","Poderes de héroes")}">${hs.map(h=>{const n=pwLeft(h.id);const on=((h.p==="x2"||h.p==="x3")&&R.mult&&R.mult.n>0&&R.mult.k===(h.p==="x2"?2:3))||(h.p==="shield"&&R.shield);
   const dis=h.p==="heal"&&ctx!=="boss";return `<button class="pw ${on?"on":""}" data-pw="${h.id}" ${(!n&&!on)||dis?"disabled":""} title="${esc(h.d)}"><span class="av">${heroArt(h.id)}</span><span class="pl"><b>${esc(h.pn)}</b><i>${on&&R.mult&&(h.p==="x2"||h.p==="x3")?"×"+R.mult.k+" · "+R.mult.n+L(" left"," rest."):on?L("active","activo"):n+"/"+h.max}</i></span></button>`;}).join("")}</div>`;}
function usePower(id,ctx){const h=HEROES().find(x=>x.id===id);const R=ctx==="boss"?BS:MS;if(!h||!R||!heroUnlocked(h))return;
  const answered=ctx==="boss"?R.ans!==null:!!R.ans[R.i];if(answered){toast(L("Use powers before you answer","Usa los poderes antes de responder"));return;}
  if(pwLeft(id)<=0){toast(L("No charges left today — they refill tomorrow","Sin cargas por hoy: se recargan mañana"));return;}
  const qid=R.ids[R.i];const q=Q[qid];let msg="";
  if(h.p==="x2"||h.p==="x3"){if(R.mult&&R.mult.n>0){toast(L("A multiplier is already active","Ya hay un multiplicador activo"));return;}R.mult={k:h.p==="x2"?2:3,n:h.p==="x2"?10:5};msg=L("XP ×","XP ×")+R.mult.k+"!";}
  else if(h.p==="fifty"){R.fifty=R.fifty||{};if(R.fifty[R.i])return;R.fifty[R.i]=shuffle("ABCD".split("").filter(x=>x!==q.a)).slice(0,2);msg="50 : 50";}
  else if(h.p==="shield"){if(R.shield)return;R.shield=true;msg=L("Second strand ready","Segunda hebra lista");}
  else if(h.p==="skip"){if(ctx!=="boss"){R.ids.push(qid);R.i++;}msg=L("Engulfed!","¡Fagocitada!");}
  else if(h.p==="heal"){if(R.hearts>=R.maxh+1){toast(L("Your hearts are full","Tus corazones están llenos"));return;}R.hearts++;msg="+1 ❤️";}
  else if(h.p==="reveal"){R.reveal=R.i;msg=L("Moonlight!","¡Luz de luna!");}
  const st=pwState();st.u[id]=(st.u[id]||0)+1;save();sound("lvl");
  const f=document.createElement("div");f.className="pwfx";f.innerHTML=`<span class="av">${heroArt(h.id)}</span><b>${esc(h.n)}</b><span>${esc(msg)}</span>`;document.body.appendChild(f);setTimeout(()=>f.remove(),1300);
  if(ctx==="boss"&&h.p==="skip")bossNextQ();else render();}
function paintPowers(m,ctx){const R=ctx==="boss"?BS:MS;const opts=$$(".opt",m);const ff=R.fifty&&R.fifty[R.i];const q=Q[R.ids[R.i]];
  if(ff)opts.forEach(o=>{if(ff.includes(o.dataset.o)){o.classList.add("gone");o.disabled=true;}});
  if(R.reveal===R.i)opts.forEach(o=>{if(o.dataset.o===q.a)o.classList.add("hint");});
  $$("[data-pw]",m).forEach(b=>b.onclick=()=>usePower(b.dataset.pw,ctx));}

let BS=null;
function bossPool(b){let pool=b.tp?MCQ.filter(id=>b.tp.includes(Q[id].t)):MCQ.slice();if(pool.length<b.hp*2)pool=MCQ.slice();
  const sc=id=>{const r=S.mcq[id];return !r?1:!r.last?0:2;};pool=shuffle(pool);if(b.hard)pool.sort((x,y)=>sc(x)-sc(y));return pool;}
function startBoss(i){const b=BOSSES()[i];if(!b||!bossUnlocked(i))return;const mh=3+Math.floor(i/3);BS={b,i:0,bi:i,ids:bossPool(b),hp:b.hp,maxhp:b.hp,hearts:mh,maxh:mh,ans:null,combo:0,right:0,xp:0,deadline:0,state:"fight",fifty:null};BS.deadline=b.t?Date.now()+b.t*1000:0;go("boss");}
function bossNextQ(){BS.i++;BS.ans=null;BS.fifty=null;BS.reveal=-1;if(BS.i>=BS.ids.length){BS.ids=BS.ids.concat(bossPool(BS.b));}BS.deadline=BS.b.t?Date.now()+BS.b.t*1000:0;render();}
function bossAnswer(a,ev){if(!BS||BS.ans!==null||BS.state!=="fight")return;const q=Q[BS.ids[BS.i]];const ok=a===q.a;
  if(!ok&&BS.shield&&a){BS.shield=false;const o=$(`.opt[data-o="${a}"]`);if(o){o.classList.add("wrong");o.disabled=true;}sound("no");toast("🧬 "+L("Helix: second try!","Helix: ¡segundo intento!"));return;}
  BS.ans=a||"";BS.deadline=0;const r=S.mcq[q.id]||{c:0,w:0};if(a){ok?r.c++:r.w++;r.last=ok;S.mcq[q.id]=r;}
  const ar=$(".bossart");
  if(ok){BS.combo++;BS.right++;const dmg=BS.combo>=3?2:1;BS.hp=Math.max(0,BS.hp-dmg);BS.lastHit=dmg;const x=12*xpMult(BS);BS.xp+=x;addXP(x,ev);sound("ok");if(ar){ar.classList.remove("hit");void ar.offsetWidth;ar.classList.add("hit");}}
  else{BS.combo=0;BS.hearts--;BS.lastHit=0;if(BS.b.regen&&BS.hp<BS.maxhp)BS.hp=Math.min(BS.maxhp,BS.hp+BS.b.regen);sound("no");const pl=$(".bhearts");if(pl){pl.classList.remove("ouch");void pl.offsetWidth;pl.classList.add("ouch");}}
  if(BS.mult&&BS.mult.n>0)BS.mult.n--;mission("mcq");save();
  if(BS.hp<=0)BS.state="win";else if(BS.hearts<=0)BS.state="lose";
  if(BS.state==="win"){S.boss=S.boss||{beat:[]};const first=!S.boss.beat.includes(BS.b.id);if(first)S.boss.beat.push(BS.b.id);const rew=first?80+40*BS.bi:30;BS.reward=rew;S.xp+=rew;save();updChips();badge("boss1");if(S.boss.beat.length>=BOSSES().length)badge("bossall");checkHeroes();}
  render();}
VIEWS.boss=m=>{if(!BS)return go("bosses");const b=BS.b;

    const n=$("#bNext");if(n)n.onclick=()=>startBoss(BS.bi+1);const a=$("#bAgain");if(a)a.onclick=()=>startBoss(BS.bi);$("#bMap").onclick=()=>{BS=null;go("bosses");};return;}

/* save codes */
const SC_SALT="hist-borja-v0";
function scHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
async function makeSaveCode(){let bytes=new TextEncoder().encode(JSON.stringify({v:1,s:S,p:{lang:LANG,lvl:LVL,theme:THEME}})),z="0";
  if(window.CompressionStream){try{const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));bytes=new Uint8Array(await new Response(cs).arrayBuffer());z="1";}catch(e){}}
  let b="";for(let i=0;i<bytes.length;i+=8192)b+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));const body=btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return "AZ"+z+"-"+body+"-"+scHash(SC_SALT+body);}
async function readSaveCode(code){code=String(code).replace(/\s/g,"");const m=code.match(/^AZ([01])-([A-Za-z0-9_-]+)-([a-z0-9]+)$/);if(!m)throw new Error("format");if(scHash(SC_SALT+m[2])!==m[3])throw new Error("check");
  const bin=atob(m[2].replace(/-/g,"+").replace(/_/g,"/"));let bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  if(m[1]==="1"){if(!window.DecompressionStream)throw new Error("browser");const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));bytes=new Uint8Array(await new Response(ds).arrayBuffer());}
  const o=JSON.parse(new TextDecoder().decode(bytes));if(!o||!o.s||typeof o.s.xp!=="number")throw new Error("data");return o;}
function saveCodeCard(){return `<div class="card savecard" id="saveCard"><div class="sc-h"><span class="sc-ic">💾</span><div><b>${L("Save code","Código de guardado")}</b><div class="muted">${L("Your progress (XP, answers, heroes, bosses) is stored only on this device. Create a save code and keep it somewhere safe — send it to yourself on WhatsApp or email — to restore everything on any device.","Tu progreso (XP, respuestas y notas) se guarda solo en este dispositivo. Crea un código de guardado y guárdalo en un lugar seguro (envíatelo por WhatsApp o correo) para recuperarlo todo en cualquier dispositivo.")}</div>${S.lastSave?`<div class="tip">${L("Last code created: ","Último código creado: ")}${new Date(S.lastSave).toLocaleDateString(LANG==="es"?"es-PE":"en-GB")}</div>`:""}</div></div>
  <div class="row"><button class="btn" id="scMake">${L("Create save code","Crear código de guardado")}</button></div>
  <div id="scOut" hidden><textarea readonly id="scTxt" rows="4" class="sctxt"></textarea><div class="row"><button class="btn sm" id="scCopy">${L("Copy","Copiar")}</button><button class="btn ghost sm" id="scDl">${L("Download .txt","Descargar .txt")}</button>${navigator.share?`<button class="btn ghost sm" id="scShare">${L("Share","Compartir")}</button>`:""}</div></div>
  <details class="scres"><summary>${L("Restore from a save code","Recuperar con un código de guardado")}</summary><textarea id="scIn" rows="4" class="sctxt" placeholder="${L("Paste your save code (AZ1-…)","Pega tu código de guardado (AZ1-…)")}"></textarea>
  <div class="row"><button class="btn" id="scLoad">${L("Restore progress","Recuperar progreso")}</button><label class="btn ghost sm">${L("Open .txt file","Abrir archivo .txt")}<input type="file" accept=".txt,text/plain" hidden id="scFile"></label></div><div id="scMsg" class="scmsg"></div></details></div>`;}
function bindSaveCode(m){const out=$("#scOut",m);if(!out)return;let code="";
  $("#scMake",m).onclick=async()=>{try{code=await makeSaveCode();$("#scTxt",m).value=code;out.hidden=false;S.lastSave=Date.now();save();sound("ok");}catch(e){toast(L("Could not create the code","No se pudo crear el código"));}};
  $("#scCopy",m).onclick=async()=>{try{await navigator.clipboard.writeText(code);toast(L("Save code copied ✔","Código copiado ✔"));}catch(e){const t=$("#scTxt",m);t.select();document.execCommand("copy");toast(L("Save code copied ✔","Código copiado ✔"));}};
  $("#scDl",m).onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([code],{type:"text/plain"}));a.download="HistoriaBorja-save-"+todayKey()+".txt";a.click();};
  const sh=$("#scShare",m);if(sh)sh.onclick=()=>navigator.share({title:"Historia Borja save code",text:code}).catch(()=>{});
  $("#scFile",m).onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{$("#scIn",m).value=t.trim();});};
  let armed=null;const msg=(t,ok)=>{const el=$("#scMsg",m);el.textContent=t;el.className="scmsg "+(ok?"ok":"err");};
  $("#scLoad",m).onclick=async()=>{const v=$("#scIn",m).value.trim();if(!v){msg(L("Paste a save code first.","Primero pega un código."));return;}
    let o;try{o=await readSaveCode(v);}catch(e){msg(e.message==="browser"?L("This browser cannot read compressed codes. Try Chrome or Safari.","Este navegador no puede leer el código. Prueba con Chrome o Safari."):L("That code is not valid. Check that you copied all of it.","Ese código no es válido. Revisa que lo copiaste completo."));return;}
    if(armed!==v){armed=v;msg(L(`This code has ${o.s.xp} XP. It will replace the progress on this device (${S.xp} XP). Tap Restore again to confirm.`,`Este código tiene ${o.s.xp} XP. Reemplazará el progreso de este dispositivo (${S.xp} XP). Toca Recuperar otra vez para confirmar.`),true);return;}
    S=Object.assign(blank(),o.s);save();if(o.p){if(o.p.lang)LANG=o.p.lang;if(o.p.lvl)LVL=o.p.lvl;if(o.p.theme)THEME=o.p.theme;savePrefs();applyTheme();}applyPrefs();updChips();confetti();toast(L("Progress restored ✔","Progreso recuperado ✔"));go("home");};}

const D=()=>DG.filter(d=>TMAP[d.t]),NM=(d,i)=>d.p[i][LANG==="es"?5:4],TT=d=>d.n[LANG==="es"?1:0];
function svg(d,mode,cur){let o=`<svg viewBox="0 0 460 270" class="dgsvg" role="img" aria-label="${esc(TT(d))}">${d.bg?r(130,6,200,258,d.bg,10):""}${d.s}`;
d.p.forEach((q,i)=>{if(mode===1&&i!==cur)return;const sd=q[2],ty=q[3],x0=sd?332:128;
o+=`<line x1="${x0}" y1="${ty-4}" x2="${q[0]}" y2="${q[1]}" stroke="#ef4444" stroke-width="1.4"/><circle cx="${q[0]}" cy="${q[1]}" r="3" fill="#ef4444"/>`;
o+=mode===0?`<text x="${sd?456:4}" y="${ty}" text-anchor="${sd?"end":"start"}" font-size="11.5" font-weight="700" fill="currentColor">${esc(NM(d,i))}</text>`:`<circle cx="${sd?344:116}" cy="${ty-4}" r="11" fill="#ef4444"/><text x="${sd?344:116}" y="${ty}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">X</text>`;});return o+"</svg>";}
let AT=null;
const start=l=>{if(!l.length)return;AT={l,k:0,right:0,ans:null,o:{}};go("atrun");};
const all=ds=>ds.flatMap(d=>d.p.map((_,i)=>[d,i]));
VIEWS.atlas=m=>{const ds=D();m.innerHTML=`<button class="back" data-go="arena">← ${L("Practice","Práctica")}</button><div class="sectionhead" style="margin-top:0"><div><div class="eyebrow">${ds.length} ${L("diagrams","diagramas")} · ${all(ds).length} ${L("labels","etiquetas")}</div><h2 style="font-size:30px;margin:2px 0">${L("Diagram atlas","Atlas de diagramas")}</h2></div><button class="btn pop" id="atMix">🔬 ${L("Label quiz · 10","Quiz de etiquetas · 10")}</button></div>
<p class="tip">${L("Study the labelled diagrams, then test yourself: a red X marks one structure and you pick its name, just like Paper 1A micrograph questions. Grey and purple images imitate electron and light micrographs.","Estudia los diagramas y luego ponte a prueba: una X roja marca una estructura y eliges su nombre, como en las preguntas de micrografías de la Prueba 1A. Las imágenes grises y moradas imitan micrografías electrónicas y ópticas.")}</p>
${ds.map(d=>`<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b>${esc(TT(d))}</b><span class="tag">${d.t} ${esc(TMAP[d.t].n)}</span></div>${svg(d,0)}<button class="btn sm" data-at="${d.id}">${L("Test me on this","Ponme a prueba")}</button></div>`).join("")}`;
$("#atMix",m).onclick=()=>start(pick(all(ds),10));
$$("[data-at]",m).forEach(b=>b.onclick=()=>start(shuffle(all(ds.filter(d=>d.id===b.dataset.at)))));};
VIEWS.atrun=m=>{if(!AT)return go("atlas");const n=AT.l.length;
if(AT.k>=n){const pc=pct(AT.right,n);if(pc>=70)confetti();m.innerHTML=`<div class="runner"><div class="card result"><div class="eyebrow">${L("Label quiz","Quiz de etiquetas")}</div><div class="big">${AT.right}/${n}</div><h2>${pc>=80?L("Sharp eyes! 🔬","¡Ojo de águila! 🔬"):L("Review the atlas and try again","Repasa el atlas e inténtalo de nuevo")}</h2><div class="row" style="justify-content:center"><button class="btn pop" id="atAg">${L("Again","Otra vez")}</button><button class="btn ghost" data-go="atlas">${L("Atlas","Atlas")}</button></div></div></div>`;$("#atAg",m).onclick=()=>start(pick(all(D()),10));return;}
const [d,i]=AT.l[AT.k];if(!AT.o[AT.k]){const nm=NM(d,i),same=d.p.map((_,j)=>NM(d,j)).filter(x=>x!==nm),oth=[...new Set(all(D()).map(([a,j])=>NM(a,j)))].filter(x=>x!==nm&&!same.includes(x));AT.o[AT.k]=shuffle([nm,...shuffle(same).concat(shuffle(oth)).slice(0,3)]);}
const op=AT.o[AT.k],ok=NM(d,i),a=AT.ans;
m.innerHTML=`<div class="runner"><button class="back" id="atB">← ${L("Back","Volver")}</button><div class="eyebrow">${AT.k+1} / ${n} · ${esc(TT(d))}</div><div class="card"><p style="margin-top:0;font-weight:700">${L("Which structure is labelled X?","¿Qué estructura señala la X?")}</p>${svg(d,1,i)}</div>
<div class="list" style="margin-top:10px">${op.map((x,j)=>`<button class="btn ghost" data-v="${j}" style="width:100%;text-align:left;margin-bottom:8px" ${a!==null?"disabled":""}>${"ABCD"[j]}. ${esc(x)}${a!==null&&x===ok?" ✔":a===j?" ✘":""}</button>`).join("")}</div>
${a!==null?`<button class="btn pop" id="atN" style="width:100%">${AT.k+1<n?L("Next →","Siguiente →"):L("Finish","Terminar")}</button>`:""}</div>`;
$("#atB",m).onclick=()=>{AT=null;go("atlas");};
$$("[data-v]",m).forEach(b=>b.onclick=ev=>{const j=+b.dataset.v,g=op[j]===ok;AT.ans=j;if(g){AT.right++;addXP(4,ev);}sound(g?"ok":"no");render();});
const nx=$("#atN",m);if(nx)nx.onclick=()=>{AT.k++;AT.ans=null;render();};};
})();
/* ---------- boot ---------- */
buildIndex();touchDay();save();updStatic();
(function(){const h=(location.hash||"").slice(1);if(h.startsWith("topic-")&&TMAP[h.slice(6)])route={v:"topic",t:h.slice(6)};else if(["home","map","arena","games","me","settings"].includes(h))route={v:h};
  const start=()=>{applyPrefs();render();};
  if(ACCESS||!P.lang)onboard(start);else render();})();

if(typeof go==="function"){const _g=go;go=function(v,...a){if(["gym","gymrun","boss","bosses","atlas","atrun"].includes(v)){toast("No disponible en esta versión");return;}return _g(v,...a);};}
</script>
